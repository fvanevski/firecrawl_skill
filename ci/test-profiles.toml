  "tests/integration/test_curated_run_integration.py",
  "tests/integration/test_issue_261_review_remediation.py",
]

[profiles.controller]
kind = "pytest"
services = ["postgres", "qdrant"]
ownership_tokens = [
  "issue310", "issue311", "issue307", "issue313", "issue314", "issue315",
  "issue305", "issue302", "research_controller", "deterministic_policy",
  "temporal_replay", "temporal_acquisition", "current_coverage_snapshot",
