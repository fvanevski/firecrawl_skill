schema_version = 1
python_version = "3.12"
toolchain_manifest = "requirements-ci.txt"
skip_allowlist = "references/pytest-skip-allowlist.json"

# Historical workflow selectors are deterministically assigned by this ordered
# ownership vocabulary. New post-baseline tests must be listed explicitly in a
# profile rather than silently joining CI by filename discovery.
ownership_order = [
  "maintenance",
  "release",
  "migration",
  "controller",
  "acquisition",
  "retrieval",
  "assessment",
  "orchestration",
  "storage",
  "tooling",
]

[profiles.static]
kind = "static"
services = []
ownership_tokens = []
selectors = []

[profiles.core]
kind = "pytest"
services = []
ownership_tokens = []
selectors = []

[profiles.tooling]
kind = "pytest"
services = []
ownership_tokens = [
  "documentation", "documented_", "cli", "research_env", "workflow.py",
  "package_boundary", "pyrefly", "pytest_skip", "exact_head", "entrypoint",
]
selectors = ["tests/contract/test_phase5_gate_remediation.py"]

[profiles.storage]
kind = "pytest"
services = ["postgres", "qdrant", "valkey"]
ownership_tokens = [
  "research_store", "postgres", "database", "storage", "blob", "qdrant",
  "uow", "corpus_repositor", "index_runtime", "index_census", "index_drain",
  "reconciliation",
]
selectors = ["tests/integration/test_audit_persistence.py"]

[profiles.acquisition]
kind = "pytest"
services = ["postgres", "qdrant"]
ownership_tokens = [
  "acquisition", "fsearch", "fscrape", "direct_scrape", "candidate_ranking",
  "search_empty_telemetry", "ingestion_batch", "extraction_preflight",
]
selectors = [
  "tests/acceptance/test_extraction_e2e.py",
  "tests/integration/test_authoritative_smart_validation.py",
  "tests/integration/test_issue_214_search_relational_provenance.py",
  "tests/integration/test_issue_215_completion_budget.py",
]

[profiles.orchestration]
