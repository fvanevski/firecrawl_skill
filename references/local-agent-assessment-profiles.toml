schema_version = 1

[profiles.phase1-control-policy]
description = "Exact-SHA Phase 1 controller, deterministic policy, temporal, acquisition, and falsification host evidence"
python_versions = ["3.11", "3.12"]
static_python = "3.12"
requires_disposable_services = true
reset_qdrant_after_tests = true
expected_skips = 0
command_timeout_seconds = 1800
candidate_code_trust = "trusted-ref-only"
trusted_refs = ["origin/main"]
repository_remote = "https://github.com/fvanevski/firecrawl_skill.git"
requires_fresh_fetch = true
allow_reviewed_pr_head = true
pr_test_python = "3.12"
pr_test_roots = ["tests/unit", "tests/integration", "tests/contract", "tests/acceptance"]
pr_test_max_files = 64
pr_test_max_nodes = 512

[profiles.phase1-control-policy.environment]
EMBEDDING_MODEL = "local-assessment"
EMBEDDING_REVISION = "test"
EMBEDDING_DIMENSION = "4"
FIRECRAWL_RELEASE_DETERMINISTIC_FIXTURES = "1"

[[profiles.phase1-control-policy.pytest_groups]]
name = "controller"
python_versions = ["3.11", "3.12"]
expected_tests = 48
selectors = [
  "tests/unit/test_issue310_research_controller.py",
  "tests/unit/test_issue310_controller_policy_authority.py",
  "tests/contract/test_issue310_fresearch_surface.py",
