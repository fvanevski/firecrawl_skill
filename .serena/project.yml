# Serena project configuration for firecrawl.
# OpenCode/global Serena context owns tool routing and the exact fixed tool set.
# Repository policy lives in AGENTS.md; keep this file project-mechanical.

project_name: "firecrawl"
encoding: "utf-8"

# No activation hook is required; OpenCode starts Serena with --project-from-cwd.
activation_command:
activation_command_timeout: 180.0

# Inherit the global line-ending setting.
line_ending:

language_backend: LSP
ignore_all_files_in_gitignore: true
ls_specific_settings: {}

# Index the repository root so Python references across src/, scripts/, and tests
# remain visible to the language server.
ls_workspace_folders:
  - "."
ls_additional_workspace_folders: []

# Rely on .gitignore plus global Serena ignore rules unless a project-specific
# indexing problem is demonstrated.
ignored_paths: []

read_only: false

# Intentionally neutral. The OpenCode Serena context defines fixed_tools.
# Project-level incremental additions could re-expand the MCP schema surface.
excluded_tools: []
included_optional_tools: []
fixed_tools: []

# Inherit global default modes; retain no-memories as a project safety belt.
# It adds only a tiny mode prompt while also preventing onboarding/memory tools
# if the global fixed tool surface is ever broadened later.
default_modes:
added_modes:
  - no-memories

# Intentionally empty. Global/project AGENTS.md plus the global Serena context
# already define code-navigation, editing, validation, and memory routing.
# Serena injects project initial_prompt on activation, so duplicating those rules
# here would consume fixed context on every fresh primary/subagent session.
initial_prompt: ""

# Preserve the existing per-call symbol-information budget.
symbol_info_budget: 10.0

read_only_memory_patterns: []
ignored_memory_patterns: []

# Python is the repository's semantic language-server surface.
language_servers:
  - python
