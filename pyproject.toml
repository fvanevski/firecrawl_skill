[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firecrawl-skill"
version = "1.0.0"
description = "Firecrawl research skill package boundary"

[tool.setuptools]
packages = [
  "firecrawl_skill",
  "firecrawl_skill._data",
  "firecrawl_skill.research_store",
  "firecrawl_skill.research_store.acquisition",
  "firecrawl_skill.research_store.acquisition.adapters",
  "firecrawl_skill.research_store.assessment",
  "firecrawl_skill.research_store.cli",
  "firecrawl_skill.research_store.orchestration",
  "firecrawl_skill.research_store.parsing",
  "firecrawl_skill.research_store.release",
  "firecrawl_skill.research_store.reporting",
  "firecrawl_skill.research_store.retrieval",
  "firecrawl_skill.research_store.retrieval.projection",
  "firecrawl_skill.research_domain",
]
py-modules = [
  "budget_policy",
  "candidate_ranking",
  "classifier",
  "drain_index_jobs",
  "model_gateway",
]

[tool.setuptools.package-dir]
"" = "scripts"
firecrawl_skill = "src/firecrawl_skill"
"firecrawl_skill._data" = "references"

[tool.setuptools.package-data]
"firecrawl_skill.research_store" = [
  "alembic/*.py",
  "alembic/*.mako",
  "alembic/versions/*.py",
  "migrations/*.sql",
]
"firecrawl_skill._data" = ["budget-policy-v1.json"]

[tool.pyrefly]
# Pyrefly is the repository's authoritative static type checker. Existing debt
# is isolated in one reviewed baseline; normal validation must never update it.
project-includes = ["scripts/**/*.py", "src/**/*.py"]
# Runtime/contract behavior remains pytest authority. Excluding the historical
# test corpus keeps the baseline focused on maintained application/tooling code;
# local changed-scope checks still type-check an explicitly changed test file.
project-excludes = ["scripts/test_*.py", "scripts/**/test_*.py"]
search-path = ["scripts", "src", "."]
python-platform = "linux"
python-version = "3.12"
baseline = "pyrefly-baseline.json"
