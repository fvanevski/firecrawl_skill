name: Normalize review regression imports

on:
  push:
    branches:
      - rc/audit-04-index-checkpoint-terminal-decision

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply and verify Ruff import normalization
        shell: bash
        run: |
          set -euo pipefail
          target='scripts/test_index_checkpoint_review_regressions.py'
          workflow='.github/workflows/fix-review-regression-imports.yml'
          python -m pip install ruff
          ruff check --fix --select I001 "$target"
          ruff check "$target"
          ruff format --check "$target"
          git diff --check -- "$target"
          changed="$(git diff --name-only -- "$target")"
          test "$changed" = "$target"
          git rm "$workflow"
          git add "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(tests): normalize review regression imports'
          git push origin "HEAD:${GITHUB_REF_NAME}"
