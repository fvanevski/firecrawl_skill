name: Extraction preflight contract

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  extraction-preflight:
    name: "Extraction preflight — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest

      - name: Start disposable PostgreSQL
        run: |
          docker run --name pg -d -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16-alpine
          sleep 5
          for i in $(seq 1 10); do
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres \
              -c "CREATE DATABASE firecrawl_issue216_test;" 2>/dev/null && break || sleep 1
          done

      - name: Run issue #216 production-seam tests
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1/firecrawl_issue216_test"
          RESEARCH_STORE_TEST_ALLOW_RESET: "firecrawl_issue216_test"
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            tests/integration/test_issue_216_extraction_preflight.py \
            tests/integration/test_acquisition_service.py \
            tests/unit/test_orchestrator.py
