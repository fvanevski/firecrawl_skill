name: Research environment adapter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Root .env loading and precedence
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Validate Bash syntax
        run: bash -n scripts/research-env

      - name: Run research environment adapter tests
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_research_env.py
