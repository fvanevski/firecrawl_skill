name: Finalize smoke gate hardening

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/issue-170-authoritative-extraction-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-store.txt pytest ruff

      - name: Apply fail-closed refinements
        run: |
          python - <<'PY'
          from pathlib import Path

          smoke_path = Path('scripts/smoke_test.py')
          smoke = smoke_path.read_text(encoding='utf-8')

          old = '''        if not source_endpoint.strip():
              raise SmokeGateError("external host supplier endpoint is required")
          canonical_source = _canonical_endpoint(source_endpoint)
          for endpoint in autonomous_endpoints:
          '''
          new = '''        if not source_endpoint.strip():
              raise SmokeGateError("external host supplier endpoint is required")
          if not autonomous_endpoints:
              raise SmokeGateError(
                  "an explicit autonomous local model endpoint fingerprint is required"
              )
          canonical_source = _canonical_endpoint(source_endpoint)
          for endpoint in autonomous_endpoints:
          '''
          if old not in smoke:
              raise SystemExit('constructor refinement anchor not found')
          smoke = smoke.replace(old, new, 1)

          old = '''        return ""

          def inspect(self, run: Any) -> dict[str, Any]:
          '''
          new = '''        return ""

          @staticmethod
          def _draft_report_text(synthesis_rows: Sequence[tuple[Any, Any, Any]]) -> str:
              """Return only persisted completed draft report-section bodies."""
              for stage, status, artifact in reversed(synthesis_rows):
                  if stage != "draft" or status != "completed":
                      continue
                  if not isinstance(artifact, Mapping):
                      return ""
                  sections = artifact.get("report_sections")
                  if not isinstance(sections, list):
                      return ""
                  bodies = [
                      str(section.get("body") or "").strip()
                      for section in sections
                      if isinstance(section, Mapping)
                  ]
                  return "\\n\\n".join(body for body in bodies if body)
              return ""

          def inspect(self, run: Any) -> dict[str, Any]:
          '''
          if old not in smoke:
              raise SystemExit('draft helper anchor not found')
          smoke = smoke.replace(old, new, 1)

          old = '''        for required_stage in ("citation_pass", "validation"):
              if required_stage not in completed_stages:
                  errors.append(f"missing completed synthesis stage: {required_stage}")
          report_text = max(
              (
                  self._longest_text(artifact)
                  for _stage, status, artifact in synthesis_rows
                  if status == "completed"
              ),
              key=len,
              default="",
          )
          if len(report_text.strip()) < 200:
              errors.append(
                  "no substantive persisted report text (minimum 200 characters)"
              )
          '''
          new = '''        for required_stage in (
              "outline",
              "binding",
              "draft",
              "citation_pass",
              "validation",
          ):
              if required_stage not in completed_stages:
                  errors.append(f"missing completed synthesis stage: {required_stage}")
          report_text = self._draft_report_text(synthesis_rows)
          if len(report_text) < 200:
              errors.append(
                  "no substantive completed draft report body (minimum 200 characters)"
              )
          '''
          if old not in smoke:
              raise SystemExit('report validation anchor not found')
          smoke = smoke.replace(old, new, 1)
          smoke_path.write_text(smoke, encoding='utf-8')

          tests_path = Path('scripts/test_smoke_test.py')
          tests = tests_path.read_text(encoding='utf-8')
          tests += '''

          def test_external_supplier_requires_autonomous_endpoint_fingerprint():
              with pytest.raises(smoke_test.SmokeGateError, match="endpoint fingerprint"):
                  smoke_test.ExternalProcessHostArtifactSupplier(
                      ["external-agent"],
                      supplier_identity="review-agent",
                      source_endpoint="http://review-agent:9000",
                      autonomous_endpoints=[],
                  )


          def test_draft_report_text_uses_only_completed_draft_sections():
              rows = [
                  ("outline", "completed", {"long_prompt": "x" * 500}),
                  ("draft", "failed", {"report_sections": [{"body": "y" * 500}]}),
                  (
                      "draft",
                      "completed",
                      {"report_sections": [{"body": "first"}, {"body": "second"}]},
                  ),
                  ("citation_pass", "completed", {"analysis": "z" * 500}),
              ]

              assert smoke_test.RunEvidenceInspector._draft_report_text(rows) == (
                  "first\\n\\nsecond"
              )
          '''
          tests_path.write_text(tests, encoding='utf-8')
          PY

      - name: Format and validate
        run: |
          ruff check --fix scripts/smoke_test.py scripts/test_smoke_test.py
          ruff format scripts/smoke_test.py scripts/test_smoke_test.py
          ruff check scripts/smoke_test.py scripts/test_smoke_test.py
          ruff format --check scripts/smoke_test.py scripts/test_smoke_test.py
          python -m py_compile scripts/smoke_test.py scripts/test_smoke_test.py
          python -m pytest -q -p no:cacheprovider scripts/test_smoke_test.py
          git diff --check

      - name: Commit validated refinements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/smoke_test.py scripts/test_smoke_test.py
          git commit -m 'test: fail closed on smoke authority and report evidence'
          git push origin "HEAD:${{ github.head_ref }}"
