name: Export Ruff fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-ruff-fixes:
    if: github.head_ref == 'agent/remove-legacy-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/remove-legacy-catalog
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate exact Ruff patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/research_store/workflow_service.py')
          text = path.read_text()
          text = text.replace('from typing import Any\n', 'from typing import Any, ClassVar\n')
          text = text.replace(
              '    _BEGIN_PATHS = {\n',
              '    _BEGIN_PATHS: ClassVar[dict[str, dict[str, tuple[str, ...]]]] = {\n',
          )
          path.write_text(text)

          path = Path('scripts/test_release_benchmark.py')
          text = path.read_text().replace(
              '        except Exception as exc:  # psycopg is optional in local unit environments\n',
              '        except psycopg.OperationalError as exc:\n',
          )
          path.write_text(text)
          PY
          python -m pip install ruff==0.16.1
          ruff check --fix .
          ruff format .
          ruff check .
          ruff format --check .
          git diff --binary > "$RUNNER_TEMP/ruff-fixes.patch"
          test -s "$RUNNER_TEMP/ruff-fixes.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-fixes-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ruff-fixes.patch
          if-no-files-found: error
          retention-days: 1
