name: Apply Ruff fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-ruff-fixes:
    if: github.head_ref == 'agent/remove-legacy-catalog' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/remove-legacy-catalog
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply and verify Ruff fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/research_store/workflow_service.py')
          text = path.read_text()
          text = text.replace('from typing import Any\n', 'from typing import Any, ClassVar\n')
          text = text.replace(
              '    _BEGIN_PATHS = {\n',
              '    _BEGIN_PATHS: ClassVar[dict[str, dict[str, tuple[str, ...]]]] = {\n',
          )
          path.write_text(text)

          path = Path('scripts/test_release_benchmark.py')
          text = path.read_text().replace(
              '        except Exception as exc:  # psycopg is optional in local unit environments\n',
              '        except psycopg.OperationalError as exc:\n',
          )
          path.write_text(text)
          PY
          python -m pip install ruff==0.16.1
          ruff check --fix .
          ruff format .
          ruff check .
          ruff format --check .
          git diff --check
          test -n "$(git status --short)"
      - name: Commit source fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts
          git commit -m 'Apply Ruff fixes'
          git push origin HEAD:agent/remove-legacy-catalog
