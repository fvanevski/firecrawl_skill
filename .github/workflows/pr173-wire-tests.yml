name: PR 173 wire verifier tests

on:
  push:
    branches:
      - agent/issue-170-authoritative-campaign-dispatch

permissions:
  contents: write

jobs:
  wire-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: agent/issue-170-authoritative-campaign-dispatch
          fetch-depth: 0

      - name: Add verifier tests to explicit CI suites
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/ci.yml")
          text = path.read_text(encoding="utf-8")
          invariant_old = (
              "            scripts/test_release_invariant_contracts.py \\\n"
              "            scripts/test_smoke_test.py\n"
          )
          invariant_new = (
              "            scripts/test_release_invariant_contracts.py \\\n"
              "            scripts/test_smoke_test.py \\\n"
              "            scripts/test_release_campaign_verifier.py\n"
          )
          full_old = (
              "            scripts/test_release_invariant_contracts.py \\\n"
              "            scripts/test_smoke_test.py \\\n"
          )
          full_new = (
              "            scripts/test_release_invariant_contracts.py \\\n"
              "            scripts/test_release_campaign_verifier.py \\\n"
              "            scripts/test_smoke_test.py \\\n"
          )
          if invariant_old not in text:
              raise SystemExit("release-invariant pytest list anchor not found")
          if full_old not in text:
              raise SystemExit("full pytest list anchor not found")
          text = text.replace(invariant_old, invariant_new, 1)
          text = text.replace(full_old, full_new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit CI test wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Verifier tests already wired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "Run authoritative verifier tests in CI"
          git push origin HEAD:agent/issue-170-authoritative-campaign-dispatch
