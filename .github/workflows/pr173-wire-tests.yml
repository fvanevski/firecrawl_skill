name: PR 173 finalize CI wiring

on:
  push:
    branches:
      - agent/issue-170-authoritative-campaign-dispatch

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: agent/issue-170-authoritative-campaign-dispatch
          fetch-depth: 0

      - name: Correct CI job name and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/ci.yml")
          text = path.read_text(encoding="utf-8")
          old = '    name: Test — Python ${{ matrix.python-version }}"\n'
          new = '    name: "Test — Python ${{ matrix.python-version }}"\n'
          if old not in text:
              raise SystemExit("CI job-name typo anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git rm .github/workflows/pr173-wire-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "Finalize authoritative verifier CI wiring"
          git push origin HEAD:agent/issue-170-authoritative-campaign-dispatch
