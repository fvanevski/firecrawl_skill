name: CLI entrypoint contracts

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    name: "CLI entrypoint contracts — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify exact checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          git diff --check

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest \
            ruff

      - name: Run focused Ruff checks
        run: |
          ruff check \
            src/firecrawl_skill/research_store/cli/__init__.py \
            src/firecrawl_skill/research_store/cli/compatibility.py \
            src/firecrawl_skill/research_store/store_admin.py \
            tests/contract/test_cli_entrypoints.py
          ruff format --check \
            src/firecrawl_skill/research_store/cli/__init__.py \
            src/firecrawl_skill/research_store/cli/compatibility.py \
            src/firecrawl_skill/research_store/store_admin.py \
            tests/contract/test_cli_entrypoints.py

      - name: Run CLI entrypoint contract regressions
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            tests/contract/test_cli_entrypoints.py
