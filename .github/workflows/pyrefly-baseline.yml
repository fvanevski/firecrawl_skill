name: Pyrefly baseline proposal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Generate Pyrefly baseline proposal
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install canonical CI toolchain
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Verify pinned Pyrefly version
        run: pyrefly --version | grep -F '1.2.0'

      - name: Generate proposed baseline
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pyrefly check --baseline pyrefly-baseline.json --update-baseline
          rc=$?
          set -e
          case "$rc" in
            0|1) ;;
            *) exit "$rc" ;;
          esac

      - name: Verify proposed baseline
        run: pyrefly check --baseline pyrefly-baseline.json --output-format=github

      - name: Upload proposed baseline only
        uses: actions/upload-artifact@v4
        with:
          name: pyrefly-baseline-proposal-${{ github.sha }}
          path: pyrefly-baseline.json
          if-no-files-found: error
          retention-days: 7
