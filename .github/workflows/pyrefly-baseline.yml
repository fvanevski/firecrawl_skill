name: Pyrefly baseline proposal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Generate Pyrefly baseline proposal
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-research-store.txt
            requirements-typecheck.txt

      - name: Install project and type-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            -r requirements-typecheck.txt \
            pytest
          pyrefly --version

      - name: Generate proposed baseline
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pyrefly check --baseline pyrefly-baseline.json --update-baseline
          rc=$?
          set -e
          case "$rc" in
            0|1)
              ;;
            *)
              echo "Pyrefly baseline generation did not complete normally (rc=$rc)." >&2
              exit "$rc"
              ;;
          esac

      - name: Verify proposed baseline
        run: pyrefly check --baseline pyrefly-baseline.json --output-format=github

      - name: Upload proposed baseline
        uses: actions/upload-artifact@v4
        with:
          name: pyrefly-baseline-proposal-${{ github.sha }}
          path: pyrefly-baseline.json
          if-no-files-found: error
          retention-days: 7
