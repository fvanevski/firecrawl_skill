name: Apply PostgreSQL authority refactor

on:
  push:
    branches:
      - agent/remove-legacy-catalog

permissions:
  contents: write

jobs:
  apply-refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v7
        with:
          ref: agent/remove-legacy-catalog
          fetch-depth: 0

      - name: Verify and apply exact refactor patch
        shell: bash
        run: |
          set -euo pipefail

          cat .refactor/fullpatch.{00..10} > "$RUNNER_TEMP/refactor.patch.xz.b64"
          echo 'a9058cb9279d706bcdadf5c01c6ec809c05b6706a5189aaa6557bb1f63bf9d44  '"$RUNNER_TEMP/refactor.patch.xz.b64" | sha256sum -c -

          base64 --decode "$RUNNER_TEMP/refactor.patch.xz.b64" > "$RUNNER_TEMP/refactor.patch.xz"
          xz --decompress --stdout "$RUNNER_TEMP/refactor.patch.xz" > "$RUNNER_TEMP/refactor.patch"
          echo '038db4d526bc9d0dae5620c9e656dfcf9b4c2ea29a824d903de6b2ae52782952  '"$RUNNER_TEMP/refactor.patch" | sha256sum -c -

          git apply --check "$RUNNER_TEMP/refactor.patch"
          git apply "$RUNNER_TEMP/refactor.patch"

          rm -f \
            .refactor/fullpatch.* \
            .refactor/patch-00.b64 \
            .refactor/publication-marker.txt \
            .refactor/publication-marker-2.txt \
            .github/workflows/apply-postgres-authority-refactor.yml \
            .github/workflows/export-pr-source.yml

          python -m compileall -q scripts
          bash -n \
            scripts/frun \
            scripts/fsearch \
            scripts/fscrape \
            scripts/fsearch_smart \
            scripts/research-db \
            scripts/research-env \
            scripts/reset-firecrawl-research

          git add -A
          git diff --cached --check

          actual_tree="$(git write-tree)"
          expected_tree='0b80236c32134b046b3e6f8544787537a0ae1a2a'
          printf 'Expected tree: %s\nActual tree:   %s\n' "$expected_tree" "$actual_tree"
          test "$actual_tree" = "$expected_tree"

      - name: Commit and push exact validated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove legacy filesystem Catalog compatibility'
          git push origin HEAD:agent/remove-legacy-catalog
