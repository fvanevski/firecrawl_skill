name: Index checkpoint

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    name: "Checkpoint — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-store.txt pytest

      - name: Start disposable PostgreSQL and Qdrant
        shell: bash
        run: |
          set -euo pipefail
          docker run --name checkpoint-pg -d \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 postgres:16-alpine
          docker run --name checkpoint-qdrant -d \
            -p 6333:6333 \
            -e QDRANT__SERVICE__READ_ONLY_ACCESS=false \
            qdrant/qdrant:v1.18.3-unprivileged

          for attempt in $(seq 1 30); do
            if PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres \
              -c 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            test "$attempt" -lt 30
            sleep 1
          done
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres \
            -c 'CREATE DATABASE firecrawl_checkpoint_test;'

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6333/readyz >/dev/null; then
              break
            fi
            test "$attempt" -lt 30
            sleep 1
          done

      - name: Run checkpoint, provenance, promotion, and curated-lifecycle tests
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1/firecrawl_checkpoint_test"
          RESEARCH_STORE_TEST_ALLOW_RESET: "firecrawl_checkpoint_test"
        run: |
          python -m pytest \
            -q \
            -ra \
            -p no:cacheprovider \
            tests/unit/test_workflow_service.py \
            tests/integration/test_completion_provenance_integration.py \
            tests/integration/test_completion_provenance_terminal_guard.py \
            tests/unit/test_curated_run_lifecycle.py \
            tests/integration/test_curated_run_integration.py \
            tests/contract/test_curated_run_documentation.py \
            tests/contract/test_curated_run_cli.py \
            tests/contract/test_index_checkpoint_contract.py \
            tests/contract/test_asset_promotion_contract.py \
            tests/integration/test_index_checkpoint_terminal_integration.py \
            tests/integration/test_asset_promotion_integration.py \
            tests/integration/test_asset_promotion_reopen_concurrency.py \
            tests/integration/test_asset_promotion_migration_compat.py \
            tests/integration/test_index_checkpoint_review_regressions.py
