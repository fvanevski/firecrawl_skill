name: Central test-authority migration export

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  export:
    name: Export validated UoW test-authority migration
    if: >-
      github.event.pull_request.number == 296 &&
      github.event.pull_request.head.ref == 'gate/refactor-epic-compat-closure' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify bounded bootstrap state
        env:
          CLEAN_SHA: 07b8413be3fa6a65722eb3aaad28b52b0a6676a4
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$CLEAN_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$CLEAN_SHA" HEAD | sort)
          printf 'Bootstrap path: %s\n' "${changed[@]}"
          expected=(
            .github/workflows/central-test-authority-migration.yml
            .github/workflows/ci.yml
            scripts/central_migrate_uow_test_authority.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-store.txt pytest ruff

      - name: Apply repository-role migration
        run: python scripts/central_migrate_uow_test_authority.py --apply

      - name: Normalize touched Python authorities
        run: |
          ruff check --fix \
            tests/integration/test_research_store_integration.py \
            tests/integration/test_arc17_corrective_defects.py \
            tests/unit/test_handoff.py \
            tests/unit/test_report_service.py \
            tests/contract/test_issue_269_uow_repository_boundary.py
          ruff format \
            tests/integration/test_research_store_integration.py \
            tests/integration/test_arc17_corrective_defects.py \
            tests/unit/test_handoff.py \
            tests/unit/test_report_service.py \
            tests/contract/test_issue_269_uow_repository_boundary.py
          ruff check \
            tests/integration/test_research_store_integration.py \
            tests/integration/test_arc17_corrective_defects.py \
            tests/unit/test_handoff.py \
            tests/unit/test_report_service.py \
            tests/contract/test_issue_269_uow_repository_boundary.py

      - name: Verify migrated authority and focused regressions
        run: |
          python scripts/central_migrate_uow_test_authority.py --verify
          python -m pytest -q -p no:cacheprovider \
            tests/contract/test_issue_269_uow_repository_boundary.py \
            tests/unit/test_handoff.py \
            tests/unit/test_report_service.py
          git diff --check

      - name: Write export metadata
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          paths = [
              'tests/contract/test_issue_269_uow_repository_boundary.py',
              'tests/integration/test_arc17_corrective_defects.py',
              'tests/integration/test_research_store_integration.py',
              'tests/unit/test_handoff.py',
              'tests/unit/test_report_service.py',
          ]
          Path('central-test-authority-export.json').write_text(
              json.dumps(
                  {
                      'schema_version': 'central-test-authority-export-v1',
                      'source_sha': os.environ['SOURCE_SHA'],
                      'paths': paths,
                      'ruff_normalized': True,
                      'focused_regressions_passed': True,
                  },
                  indent=2,
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload validated transformed files
        uses: actions/upload-artifact@v4
        with:
          name: central-test-authority-export-${{ github.event.pull_request.head.sha }}
          path: |
            central-test-authority-export.json
            tests/contract/test_issue_269_uow_repository_boundary.py
            tests/integration/test_arc17_corrective_defects.py
            tests/integration/test_research_store_integration.py
            tests/unit/test_handoff.py
            tests/unit/test_report_service.py
          if-no-files-found: error
          retention-days: 7
