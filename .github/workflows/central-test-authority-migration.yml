name: Central test-authority migration

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate UoW test authority
    if: >-
      github.event.pull_request.number == 296 &&
      github.event.pull_request.head.ref == 'gate/refactor-epic-compat-closure' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify bounded bootstrap state
        env:
          CLEAN_SHA: 07b8413be3fa6a65722eb3aaad28b52b0a6676a4
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$CLEAN_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$CLEAN_SHA" HEAD | sort)
          printf 'Bootstrap path: %s\n' "${changed[@]}"
          expected=(
            .github/workflows/central-test-authority-migration.yml
            .github/workflows/ci.yml
            scripts/central_migrate_uow_test_authority.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-store.txt pytest ruff

      - name: Apply repository-role migration
        run: python scripts/central_migrate_uow_test_authority.py --apply

      - name: Normalize touched Python authorities
        run: |
          ruff check --fix \
            tests/integration/test_research_store_integration.py \
            tests/integration/test_arc17_corrective_defects.py \
            tests/unit/test_handoff.py \
            tests/unit/test_report_service.py \
            tests/contract/test_issue_269_uow_repository_boundary.py
          ruff format \
            tests/integration/test_research_store_integration.py \
            tests/integration/test_arc17_corrective_defects.py \
            tests/unit/test_handoff.py \
            tests/unit/test_report_service.py \
            tests/contract/test_issue_269_uow_repository_boundary.py
          ruff check \
            tests/integration/test_research_store_integration.py \
            tests/integration/test_arc17_corrective_defects.py \
            tests/unit/test_handoff.py \
            tests/unit/test_report_service.py \
            tests/contract/test_issue_269_uow_repository_boundary.py

      - name: Verify migrated authority and focused regressions
        run: |
          python scripts/central_migrate_uow_test_authority.py --verify
          python -m pytest -q -p no:cacheprovider \
            tests/contract/test_issue_269_uow_repository_boundary.py \
            tests/unit/test_handoff.py \
            tests/unit/test_report_service.py
          git diff --check

      - name: Remove bootstrap-only execution surface
        env:
          CLEAN_SHA: 07b8413be3fa6a65722eb3aaad28b52b0a6676a4
        shell: bash
        run: |
          set -euo pipefail
          git show "$CLEAN_SHA:.github/workflows/ci.yml" > .github/workflows/ci.yml
          rm scripts/central_migrate_uow_test_authority.py
          rm .github/workflows/central-test-authority-migration.yml
          git diff --check

      - name: Commit migrated test authority
        env:
          TARGET_BRANCH: gate/refactor-epic-compat-closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git diff --cached --stat
          test -n "$(git diff --cached --name-only)"
          git commit -m 'test: migrate integration authority to named repositories'
          git push origin "HEAD:$TARGET_BRANCH"
