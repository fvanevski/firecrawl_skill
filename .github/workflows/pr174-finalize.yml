name: PR 174 finalize corrective release path

on:
  push:
    branches:
      - agent/issue-170-fix-exact-head-ci-evidence

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v7
        with:
          ref: agent/issue-170-fix-exact-head-ci-evidence
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: python -m pip install ruff==0.16.1 PyYAML==6.0.3

      - name: Replace embedded fallback and validate sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/release-campaign.yml")
          text = path.read_text(encoding="utf-8")
          start_marker = '          if [[ ! -f "$MANIFEST" ]]; then\n'
          end_marker = '          MANIFEST_SHA=$(sha256sum "$MANIFEST" | cut -d\' \' -f1)\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''          python scripts/ensure_release_failure_manifest.py \\
            --manifest "$MANIFEST" \\
            --candidate-sha "$CANDIDATE_SHA" \\
            --repository "$GITHUB_REPOSITORY" \\
            --workflow-run-id "$GITHUB_RUN_ID" \\
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \\
            --workflow-ref "$GITHUB_WORKFLOW_REF" \\
            --workflow-sha "$WORKFLOW_SHA" \\
            --ci-run-id "$CI_RUN_ID" \\
            --ci-evidence-run-id "$CI_EVIDENCE_RUN_ID" \\
            --ci-evidence-sha256 "$CI_EVIDENCE_SHA256"\n'''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

          ruff check --fix \
            scripts/build_exact_head_ci_evidence.py \
            scripts/verify_release_campaign_ci.py \
            scripts/render_release_evidence_comment.py \
            scripts/ensure_release_failure_manifest.py \
            scripts/test_exact_head_ci_evidence.py
          ruff format \
            scripts/build_exact_head_ci_evidence.py \
            scripts/verify_release_campaign_ci.py \
            scripts/render_release_evidence_comment.py \
            scripts/ensure_release_failure_manifest.py \
            scripts/test_exact_head_ci_evidence.py
          ruff check \
            scripts/build_exact_head_ci_evidence.py \
            scripts/verify_release_campaign_ci.py \
            scripts/render_release_evidence_comment.py \
            scripts/ensure_release_failure_manifest.py \
            scripts/test_exact_head_ci_evidence.py
          ruff format --check \
            scripts/build_exact_head_ci_evidence.py \
            scripts/verify_release_campaign_ci.py \
            scripts/render_release_evidence_comment.py \
            scripts/ensure_release_failure_manifest.py \
            scripts/test_exact_head_ci_evidence.py

          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in (
              Path(".github/workflows/ci.yml"),
              Path(".github/workflows/release-campaign.yml"),
              Path(".github/workflows/release-campaign-dispatch.yml"),
          ):
              value = yaml.safe_load(path.read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise SystemExit(f"invalid workflow object: {path}")
          PY

      - name: Commit final corrective branch state
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr174-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/release-campaign.yml \
            .github/workflows/release-campaign-dispatch.yml \
            scripts/build_exact_head_ci_evidence.py \
            scripts/verify_release_campaign_ci.py \
            scripts/render_release_evidence_comment.py \
            scripts/ensure_release_failure_manifest.py \
            scripts/test_exact_head_ci_evidence.py
          git commit -m "Finalize completed-CI release evidence handoff"
          git push origin HEAD:agent/issue-170-fix-exact-head-ci-evidence
