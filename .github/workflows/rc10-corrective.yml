name: RC-10 corrective contracts

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrective-contract:
    name: "RC-10 PostgreSQL corrective contract — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record exact tested commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "tested_sha=$EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest \
            ruff

      - name: Start disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run --name pg -d \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            postgres:16-alpine
          for attempt in $(seq 1 20); do
            if PGPASSWORD=postgres psql \
              -h 127.0.0.1 \
              -U postgres \
              -c "CREATE DATABASE firecrawl_rc10_test;"; then
              break
            fi
            if [[ "$attempt" = 20 ]]; then
              exit 1
            fi
            sleep 1
          done

      - name: Run corrective tests
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: >-
            postgresql://postgres:postgres@127.0.0.1/firecrawl_rc10_test
          RESEARCH_STORE_TEST_ALLOW_RESET: firecrawl_rc10_test
          CORRECTIVE_JUNIT: ${{ runner.temp }}/rc10-${{ matrix.python-version }}.xml
        run: |
          python -m pytest \
            -q \
            -ra \
            -p no:cacheprovider \
            --junitxml="$CORRECTIVE_JUNIT" \
            scripts/test_release_campaign_corrective.py
          python scripts/verify_corrective_junit.py \
            --junitxml "$CORRECTIVE_JUNIT" \
            --test-name test_current_schema_completion_and_stage_timing_diagnostics

      - name: Run focused quality checks
        run: |
          ruff check \
            scripts/release_campaign_timing.py \
            scripts/release_campaign_timing_contract.py \
            scripts/run_release_campaign.py \
            scripts/verify_release_campaign_strict.py \
            scripts/enforce_release_campaign_outcomes.py \
            scripts/verify_corrective_junit.py \
            scripts/test_release_campaign_corrective.py
          ruff format --check \
            scripts/release_campaign_timing.py \
            scripts/release_campaign_timing_contract.py \
            scripts/run_release_campaign.py \
            scripts/verify_release_campaign_strict.py \
            scripts/enforce_release_campaign_outcomes.py \
            scripts/verify_corrective_junit.py \
            scripts/test_release_campaign_corrective.py

      - name: Upload node-level corrective evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc10-corrective-${{ github.event.pull_request.head.sha || github.sha }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/rc10-${{ matrix.python-version }}.xml
          if-no-files-found: error
          retention-days: 90
