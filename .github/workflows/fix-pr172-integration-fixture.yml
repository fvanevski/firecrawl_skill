name: Fix PR 172 integration fixture

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-pr172-integration-fixture:
    if: github.head_ref == 'agent/issue-170-resolve-pr157-threads'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out follow-up branch
        uses: actions/checkout@v7
        with:
          ref: agent/issue-170-resolve-pr157-threads
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-store.txt pytest ruff

      - name: Update strict periodic-window integration fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/test_performance_telemetry_integration.py')
          text = path.read_text(encoding='utf-8')
          old = '''        svc = PerformanceTelemetryService(telemetry_connection)
        sample = ResourceSample(
            run_id=str(run_id),
            device_type="cpu",
            device_index=0,
            sample_type="cpu_percent",
            value=45.0,
            sample_at="2026-07-30T12:00:00+00:00",
            collector="psutil",
            sample_number=0,
            status="measured",
            window_start="2026-07-30T11:59:00+00:00",
            window_end="2026-07-30T12:00:00+00:00",
            sampling_interval_seconds=1.0,
        )
        svc.record_resource_sample(sample)
        telemetry_connection.commit()
'''
          new = '''        svc = PerformanceTelemetryService(telemetry_connection)
        for sample_number, value, sample_at in (
            (0, 40.0, "2026-07-30T11:59:30+00:00"),
            (1, 50.0, "2026-07-30T12:00:00+00:00"),
        ):
            svc.record_resource_sample(
                ResourceSample(
                    run_id=str(run_id),
                    device_type="cpu",
                    device_index=0,
                    sample_type="cpu_percent",
                    value=value,
                    sample_at=sample_at,
                    collector="psutil",
                    sample_number=sample_number,
                    status="measured",
                    window_start="2026-07-30T11:59:00+00:00",
                    window_end="2026-07-30T12:00:00+00:00",
                    sampling_interval_seconds=1.0,
                )
            )
        telemetry_connection.commit()
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one integration fixture block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old_doc = '"""When resource samples have window metadata, status should be MEASURED."""'
          new_doc = '"""A complete two-sample CPU window is MEASURED in strict mode."""'
          if text.count(old_doc) != 1:
              raise SystemExit(f'expected one integration docstring, found {text.count(old_doc)}')
          path.write_text(text.replace(old_doc, new_doc, 1), encoding='utf-8')
          PY

      - name: Validate affected tests
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1/firecrawl_telemetry_test
          RESEARCH_STORE_TEST_ALLOW_RESET: firecrawl_telemetry_test
        run: |
          ruff format scripts/test_performance_telemetry_integration.py
          ruff check scripts/test_performance_telemetry_integration.py
          docker run --name pg -d -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16-alpine
          sleep 5
          for i in $(seq 1 10); do
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE firecrawl_telemetry_test;' 2>/dev/null && break || sleep 1
          done
          python -m pytest -q -p no:cacheprovider \
            scripts/test_performance_telemetry_integration.py::TestResourceCompleteness

      - name: Commit validated fixture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test_performance_telemetry_integration.py
          git commit -m 'test: align resource integration fixture with periodic policy'
          git push origin HEAD:agent/issue-170-resolve-pr157-threads
