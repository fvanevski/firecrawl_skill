name: Acquisition slice exact-head review

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/research_store/acquisition/**"
      - "scripts/research_store/acquisition_authority.py"
      - "scripts/research_store/acquisition_service.py"
      - "scripts/research_store/bounded_acquisition.py"
      - "scripts/research_store/bounded_orchestrator.py"
      - "scripts/research_store/checkpoint_orchestrator.py"
      - "scripts/research_store/container.py"
      - "scripts/research_store/direct_scrape_service.py"
      - "scripts/research_store/fsearch_service.py"
      - "scripts/research_store/orchestration/composition.py"
      - "scripts/research_store/ports.py"
      - "scripts/research_store/search_provenance.py"
      - "scripts/test_issue_262_acquisition_slice.py"
      - "scripts/test_issue_262_runtime_review.py"
      - "references/acquisition-boundary.md"
      - "references/acquisition-slice-review-remediation.md"
      - "references/local-agent-validation.md"
      - ".github/workflows/acquisition-slice-review.yml"
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: "Exact candidate commit SHA to validate"
        required: true
        type: string
      base-sha:
        description: "Exact base commit SHA for changed-scope validation"
        required: true
        type: string

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate-sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base-sha }}

jobs:
  exact-head-review:
    name: Acquisition slice exact-head authorities
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify immutable review identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$CANDIDATE_SHA" != ""
          test "$BASE_SHA" != ""
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          TESTED_SHA=$(git rev-parse HEAD)
          echo "tested_sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "base_sha=$BASE_SHA"
            echo "tested_sha=$TESTED_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check exact base-to-head diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...$CANDIDATE_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-research-store.txt
            requirements-typecheck.txt

      - name: Install validation authorities
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            -r requirements-typecheck.txt \
            pytest \
            ruff
          ruff --version
          pyrefly --version

      - name: Determine exact changed Python scope
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED_PY < <(
            git diff --name-only --diff-filter=ACMR \
              "$BASE_SHA...$CANDIDATE_SHA" -- '*.py'
          )
          printf '%s\n' "${CHANGED_PY[@]}" | tee "$RUNNER_TEMP/changed-python.txt"
          if ((${#CHANGED_PY[@]})); then
            printf 'paths<<EOF\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' "${CHANGED_PY[@]}" >> "$GITHUB_OUTPUT"
            printf 'EOF\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Ruff on exact changed Python scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED_PY < "$RUNNER_TEMP/changed-python.txt"
          if ((${#CHANGED_PY[@]})); then
            ruff check "${CHANGED_PY[@]}"
            ruff format --check --diff "${CHANGED_PY[@]}"
          fi

      - name: Pyrefly on exact changed Python scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t CHANGED_PY < "$RUNNER_TEMP/changed-python.txt"
          if ((${#CHANGED_PY[@]})); then
            pyrefly check "${CHANGED_PY[@]}"
          fi

      - name: Full-project Pyrefly
        run: pyrefly check

      - name: Start disposable PostgreSQL
        run: |
          docker run --name pg -d \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            postgres:16-alpine
          for i in $(seq 1 20); do
            PGPASSWORD=postgres psql \
              -h 127.0.0.1 \
              -U postgres \
              -c "CREATE DATABASE firecrawl_acquisition_slice_review;" \
              2>/dev/null && break
            sleep 1
          done
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -lqt \
            | grep -q firecrawl_acquisition_slice_review

      - name: Run focused acquisition-slice authorities
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: >-
            postgresql://postgres:postgres@127.0.0.1/firecrawl_acquisition_slice_review
          RESEARCH_STORE_TEST_ALLOW_RESET: firecrawl_acquisition_slice_review
        run: |
          python -m pytest \
            -q \
            -ra \
            -p no:cacheprovider \
            scripts/test_issue_262_acquisition_slice.py \
            scripts/test_issue_262_runtime_review.py \
            scripts/test_acquisition_service.py \
            scripts/test_acquisition_authority.py \
            scripts/test_issue_216_extraction_preflight.py \
            scripts/test_direct_scrape_service.py \
            scripts/test_authoritative_fsearch.py \
            scripts/test_authoritative_fsearch_review.py \
            scripts/test_authoritative_fscrape.py \
            scripts/test_authoritative_fscrape_cli.py \
            scripts/test_postgres_acquisition_repositories.py \
            scripts/test_package_boundary.py \
            scripts/test_orchestrator.py \
            scripts/test_issue_217_ingestion_batch_semantics.py \
            scripts/test_audit_release_gate_matrix.py

      - name: Write exact-head review evidence
        env:
          TESTED_SHA: ${{ steps.identity.outputs.tested_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema_version": "acquisition-slice-exact-head-review-v1",
              "status": "passed",
              "base_sha": os.environ["BASE_SHA"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "tested_sha": os.environ["TESTED_SHA"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "authorities": [
                  "ruff-changed-scope",
                  "ruff-format-changed-scope",
                  "pyrefly-changed-scope",
                  "pyrefly-full-project",
                  "pytest-acquisition-slice-focused-and-contract",
              ],
          }
          Path("acquisition-slice-review-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload exact-head review evidence
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-slice-review-${{ steps.identity.outputs.tested_sha }}
          path: acquisition-slice-review-evidence.json
          if-no-files-found: error
          retention-days: 90
