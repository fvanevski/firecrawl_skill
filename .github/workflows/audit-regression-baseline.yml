name: Audit regression baseline

on:
  push:
    branches:
      - main
      - "rc/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-regression-baseline:
    name: "Audit regression baseline — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-research-store.txt
            requirements-typecheck.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            -r requirements-typecheck.txt \
            pytest

      - name: Type-check disposable service regression contract
        run: |
          pyrefly check \
            scripts/test_disposable_test_services.py \
            --output-format=github

      - name: Run and classify audited regression baseline
        env:
          PYTEST_JUNIT: ${{ runner.temp }}/audit-regression-${{ matrix.python-version }}.xml
          PYTEST_SKIP_REPORT: ${{ runner.temp }}/audit-regression-skips-${{ matrix.python-version }}.json
        run: |
          python -m pytest \
            -q \
            -ra \
            --junitxml="$PYTEST_JUNIT" \
            -p no:cacheprovider \
            scripts/test_disposable_test_services.py \
            scripts/test_audit_regression_baseline.py \
            scripts/test_issue_213_search_empty_telemetry.py \
            scripts/test_issue_219_verifier_inconclusive.py \
            scripts/test_issue_220_doctor_diagnostics.py
          python scripts/verify_pytest_skips.py \
            --junitxml "$PYTEST_JUNIT" \
            --allowlist references/audit-regression-skip-allowlist.json \
            --output "$PYTEST_SKIP_REPORT"

      - name: Upload audited regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-regression-evidence-${{ github.event.pull_request.head.sha || github.sha }}-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/audit-regression-${{ matrix.python-version }}.xml
            ${{ runner.temp }}/audit-regression-skips-${{ matrix.python-version }}.json
          if-no-files-found: warn
          retention-days: 90
