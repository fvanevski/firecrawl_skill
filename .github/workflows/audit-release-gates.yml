name: Audit remediation release gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: Exact commit SHA to validate
        required: false
        type: string

permissions:
  contents: read

jobs:
  gates:
    name: ARC-17 disposable release gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: ${{ inputs.candidate-sha || github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate-sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-store.txt pytest ruff mypy
          python -m pip install --no-deps -e .

      - name: Start disposable PostgreSQL and Qdrant
        shell: bash
        run: |
          set -euo pipefail
          docker run --name arc17-pg -d \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 postgres:16-alpine
          docker run --name arc17-qdrant -d \
            -p 6333:6333 \
            -e QDRANT__SERVICE__READ_ONLY_ACCESS=false \
            qdrant/qdrant:v1.18.3-unprivileged

          for attempt in $(seq 1 30); do
            if PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres \
              -c 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            test "$attempt" -lt 30
            sleep 1
          done
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres \
            -c 'CREATE DATABASE firecrawl_arc17_test_gate;'

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6333/readyz >/dev/null; then
              break
            fi
            test "$attempt" -lt 30
            sleep 1
          done

      - name: Initialize immutable gate evidence directory
        shell: bash
        run: |
          set -euo pipefail
          printf 'AUDIT_GATE_DIR=%s\n' \
            "$RUNNER_TEMP/audit-release-gates-$CANDIDATE_SHA" \
            >> "$GITHUB_ENV"

      - name: Validate machine-readable gate contract
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/audit_release_gate_matrix.py validate

      - name: Execute CI-phase release gates
        env:
          PYTHONPATH: scripts
          RESEARCH_STORE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1/firecrawl_arc17_test_gate
          RESEARCH_STORE_TEST_ALLOW_RESET: firecrawl_arc17_test_gate
          QDRANT_URL: http://127.0.0.1:6333
          RESEARCH_STORE_TEST_QDRANT_URL: http://127.0.0.1:6333
          RESEARCH_STORE_TEST_QDRANT_ALLOW_RESET: http://127.0.0.1:6333
        run: |
          python scripts/audit_release_gate_matrix.py run \
            --phase ci \
            --candidate-sha "$CANDIDATE_SHA" \
            --output-dir "$AUDIT_GATE_DIR/ci"

      - name: Execute disposable service release gates
        env:
          PYTHONPATH: scripts
          RESEARCH_STORE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1/firecrawl_arc17_test_gate
          RESEARCH_STORE_TEST_ALLOW_RESET: firecrawl_arc17_test_gate
          QDRANT_URL: http://127.0.0.1:6333
          RESEARCH_STORE_TEST_QDRANT_URL: http://127.0.0.1:6333
          RESEARCH_STORE_TEST_QDRANT_ALLOW_RESET: http://127.0.0.1:6333
        run: |
          python scripts/audit_release_gate_matrix.py run \
            --phase disposable \
            --candidate-sha "$CANDIDATE_SHA" \
            --output-dir "$AUDIT_GATE_DIR/disposable"

      - name: Upload complete ARC-17 gate evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-release-gates-${{ inputs.candidate-sha || github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/audit-release-gates-${{ inputs.candidate-sha || github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 90

      - name: Record gate artifact identity
        if: always()
        shell: bash
        run: |
          {
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "artifact_id=${{ steps.upload.outputs.artifact-id }}"
            echo "artifact_url=${{ steps.upload.outputs.artifact-url }}"
            echo "artifact_digest=${{ steps.upload.outputs.artifact-digest }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
