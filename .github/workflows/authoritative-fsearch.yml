name: Fsearch Authoritative Contract

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  authoritative-fsearch:
    name: Authoritative fsearch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: firecrawl_fsearch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d firecrawl_fsearch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/firecrawl_fsearch_test
      BLOB_ROOT: ${{ github.workspace }}/.ci-blobs
      FIRECRAWL_RESEARCH_AUTO_ENV: "0"
      FIRECRAWL_RESEARCH_PERSIST: "on"
      FIRECRAWL_SEARCH_CACHE: "off"
      FIRECRAWL_SEARCH_CACHE_WRITE: "off"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check final diff
        run: git diff --check "origin/${GITHUB_BASE_REF:-main}...HEAD"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-store.txt

      - name: Apply research-store migrations
        run: |
          mkdir -p "$BLOB_ROOT"
          python scripts/research_store_migrate.py upgrade head
          python scripts/research_store_migrate.py check

      - name: Run fsearch service and CLI contract tests
        run: |
          python -m pytest -q -p no:cacheprovider \
            scripts/test_authoritative_fsearch.py \
            scripts/test_authoritative_fsearch_review.py

      - name: Run fsearch wrapper end-to-end tests
        run: |
          python -m pytest -q -p no:cacheprovider \
            scripts/test_fsearch_wrapper_e2e.py

      - name: Run fsearch workflow contract tests
        run: |
          python -m pytest -q -p no:cacheprovider \
            scripts/test_workflow.py \
            -k fsearch
