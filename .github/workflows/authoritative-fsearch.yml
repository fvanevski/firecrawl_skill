name: Authoritative fsearch contract

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rc7-patch:
    name: Apply RC-7 failure-path profile
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'refactor/rc7-authoritative-smart-validation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out RC-7 branch
        uses: actions/checkout@v7
        with:
          ref: refactor/rc7-authoritative-smart-validation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply issue-exact validator patch
        run: |
          python -m pip install ruff
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/live_validate.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '''PROFILE_OPERATION_CAPS = {
              "focused": 40,
              "termux": 40,
              "full": 100,
          }
          ''': '''PROFILE_OPERATION_CAPS = {
              "focused": 40,
              "failure-path": 20,
              "full": 100,
          }
          ''',
              '''            cursor.execute(
                  """SELECT DISTINCT c.id,c.canonical_url,c.domain,
                                    coalesce(o.title,''),coalesce(o.snippet,'')
                     FROM search_candidates c
                     LEFT JOIN candidate_occurrences o
                       ON o.candidate_id=c.id AND o.run_id=c.run_id
                     WHERE c.run_id=%s
                     ORDER BY c.id""",
                  (run_id,),
              )
          ''': '''            cursor.execute(
                  """SELECT c.id,c.canonical_url,c.domain,
                            coalesce(c.title,''),coalesce(c.snippet,'')
                     FROM search_candidates c
                     WHERE c.run_id=%s
                     ORDER BY c.id""",
                  (run_id,),
              )
          ''',
              '''        self.validate_dry_run()
              if self.args.profile == "termux":
                  self.run_smart("termux", "termux", resume=True)
              else:
                  self.run_smart("academic", "academic", resume=True)
              self.run_fscrape_valkey_loss()

              if self.args.profile == "full":
          ''': '''        self.validate_dry_run()
              if self.args.profile == "failure-path":
                  self.run_fscrape_valkey_loss()
                  return self.finish()

              self.run_smart("academic", "academic", resume=True)
              self.run_fscrape_valkey_loss()

              if self.args.profile == "full":
          ''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected replacement block not found: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          ruff format scripts/live_validate.py
          ruff check scripts/live_validate.py

      - name: Restore workflows and push patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin main
          git checkout origin/main -- .github/workflows/authoritative-fsearch.yml
          git rm .github/workflows/rc7-apply-failure-profile.yml
          git add scripts/live_validate.py
          git diff --check
          git commit -m "fix: add bounded failure-path validation"
          git push origin HEAD:refactor/rc7-authoritative-smart-validation

  authoritative-fsearch:
    name: "Authoritative fsearch — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check final diff
        run: git diff --check "origin/${GITHUB_BASE_REF:-main}...HEAD"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest \
            ruff

      - name: Run required quality checks
        run: |
          ruff check .
          ruff format --check .

      - name: Start disposable PostgreSQL
        run: |
          docker run --name pg -d \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            postgres:16-alpine
          for i in $(seq 1 15); do
            PGPASSWORD=postgres psql \
              -h 127.0.0.1 \
              -U postgres \
              -c "CREATE DATABASE firecrawl_fsearch_test;" \
              2>/dev/null && break
            sleep 1
          done
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -lqt \
            | grep -q firecrawl_fsearch_test

      - name: Run authoritative fsearch tests
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: >-
            postgresql://postgres:postgres@127.0.0.1/firecrawl_fsearch_test
          RESEARCH_STORE_TEST_ALLOW_RESET: firecrawl_fsearch_test
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_authoritative_fsearch.py \
            scripts/test_authoritative_fsearch_review.py
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_workflow.py \
            -k fsearch
