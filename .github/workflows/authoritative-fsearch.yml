name: Authoritative fsearch contract

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  authoritative-fsearch:
    name: "Authoritative fsearch — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check final diff
        run: git diff --check "origin/${GITHUB_BASE_REF:-main}...HEAD"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest \
            ruff

      - name: Run required quality checks
        run: |
          ruff check .
          ruff format --check .

      - name: Start disposable PostgreSQL
        run: |
          docker run --name pg -d \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            postgres:16-alpine
          for i in $(seq 1 15); do
            PGPASSWORD=postgres psql \
              -h 127.0.0.1 \
              -U postgres \
              -c "CREATE DATABASE firecrawl_fsearch_test;" \
              2>/dev/null && break
            sleep 1
          done
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -lqt \
            | grep -q firecrawl_fsearch_test

      - name: Run authoritative fsearch and RC-7 acceptance tests
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: >-
            postgresql://postgres:postgres@127.0.0.1/firecrawl_fsearch_test
          RESEARCH_STORE_TEST_ALLOW_RESET: firecrawl_fsearch_test
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_authoritative_fsearch.py \
            scripts/test_authoritative_fsearch_review.py
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_workflow.py \
            -k fsearch
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_authoritative_smart_validation.py \
            scripts/test_authoritative_live_validation_profiles.py

  rc7-finalize:
    name: RC-7 one-time content finalizer
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'refactor/rc7-authoritative-smart-validation' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/rc7-authoritative-smart-validation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.16.1
      - name: Apply documentation and fixture corrections
        run: python scripts/rc7_finalize.py
      - name: Format and validate corrected content
        run: |
          ruff format scripts/test_authoritative_smart_validation.py
          ruff check \
            scripts/fsearch_smart \
            scripts/live_validate.py \
            scripts/research_store/smart_orchestrator.py \
            scripts/test_authoritative_smart_validation.py \
            scripts/test_authoritative_live_validation_profiles.py
          git diff --check
      - name: Commit non-workflow corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            README.md \
            SKILL.md \
            references/operations-runbook.md \
            scripts/test_authoritative_smart_validation.py \
            scripts/rc7_finalize.py \
            .rc7-doc-trigger
          git commit -m 'docs(rc7): finalize authoritative validation and recovery contracts'
          git push origin HEAD:refactor/rc7-authoritative-smart-validation
