name: Research controller exact-head review

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/firecrawl_skill/research_store/research_controller.py"
      - "src/firecrawl_skill/research_store/research_controller_contract.py"
      - "src/firecrawl_skill/research_store/research_controller_cli.py"
      - "src/firecrawl_skill/research_store/operator_action_service.py"
      - "src/firecrawl_skill/research_store/postgres_operator_actions.py"
      - "src/firecrawl_skill/research_store/candidate_policy_service.py"
      - "src/firecrawl_skill/research_store/asset_promotion_core.py"
      - "src/firecrawl_skill/research_store/postgres_corpus.py"
      - "src/firecrawl_skill/research_store/postgres_uow_core.py"
      - "src/firecrawl_skill/research_store/postgres.py"
      - "src/firecrawl_skill/research_store/ports.py"
      - "src/firecrawl_skill/research_store/alembic/versions/0045_operator_actions.py"
      - "src/firecrawl_skill/research_store/retained_completion_service.py"
      - "src/firecrawl_skill/research_store/retained_review_service.py"
      - "src/firecrawl_skill/research_store/semantic_service.py"
      - "src/firecrawl_skill/research_store/smart_search_application.py"
      - "scripts/fresearch"
      - "schemas/research-workflow/workflow-directive-v1.json"
      - "schemas/research-workflow/workflow-directive-v2.json"
      - "schemas/research-workflow/research-result-v1.json"
      - "schemas/research-workflow/research-result-v2.json"
      - "schemas/research-workflow/operator-action-v1.json"
      - "tests/unit/test_issue310_research_controller.py"
      - "tests/unit/test_issue310_controller_policy_authority.py"
      - "tests/unit/test_issue313_operator_action_authority.py"
      - "tests/contract/test_issue310_fresearch_surface.py"
      - "tests/contract/test_issue313_operator_action_surface.py"
      - "tests/integration/test_issue310_research_controller.py"
      - "tests/integration/test_issue313_operator_actions.py"
      - "tests/integration/test_issue310_controller_policy_authority.py"
      - "tests/integration/test_issue314_handoff_completion.py"
      - "tests/integration/test_issue315_minimal_agent_gate.py"
      - ".github/workflows/research-controller-slice-review.yml"
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: "Exact candidate commit SHA to validate"
        required: true
        type: string
      base-sha:
        description: "Exact implementation base SHA"
        required: true
        type: string

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate-sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base-sha }}

jobs:
  static-authorities:
    name: Controller static authorities
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify immutable identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git diff --check "$BASE_SHA...$CANDIDATE_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-research-store.txt
            requirements-typecheck.txt

      - name: Install static authorities
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            -r requirements-typecheck.txt \
            pytest \
            ruff==0.16.4
          ruff --version
          pyrefly --version

      - name: Determine changed Python scope
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR \
            "$BASE_SHA...$CANDIDATE_SHA" -- '*.py' \
            > "$RUNNER_TEMP/changed-python.txt"
          cat "$RUNNER_TEMP/changed-python.txt"

      - name: Ruff on changed Python scope
        run: |
          set -euo pipefail
          mapfile -t CHANGED_PY < "$RUNNER_TEMP/changed-python.txt"
          if ((${#CHANGED_PY[@]})); then
            ruff check "${CHANGED_PY[@]}"
            ruff format --check --diff "${CHANGED_PY[@]}"
          fi

      - name: Pyrefly on changed Python scope
        run: |
          set -euo pipefail
          mapfile -t CHANGED_PY < "$RUNNER_TEMP/changed-python.txt"
          if ((${#CHANGED_PY[@]})); then
            pyrefly check "${CHANGED_PY[@]}"
          fi

      - name: Full-project Pyrefly
        run: pyrefly check

  runtime-authorities:
    name: Controller runtime authorities — Python ${{ matrix.python-version }}
    needs: static-authorities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            namespace: issue310-py311
          - python-version: "3.12"
            namespace: issue310-py312

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify immutable identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install runtime authorities
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest

      - name: Bind repository-sanctioned disposable services
        env:
          TEST_NAMESPACE: ${{ matrix.namespace }}
        run: |
          set -euo pipefail
          test -s references/local-disposable-test-services.md
          cat references/local-disposable-test-services.md >/dev/null
          scripts/disposable-test-services --help >/dev/null
          echo "DISPOSABLE_SERVICE_ACK=reference-read;helper-bound;namespace=$TEST_NAMESPACE"

      - name: Run controller and boundary authorities
        env:
          TEST_NAMESPACE: ${{ matrix.namespace }}
          EMBEDDING_MODEL: issue310-test
          EMBEDDING_REVISION: test
          EMBEDDING_DIMENSION: "4"
          FIRECRAWL_RELEASE_DETERMINISTIC_FIXTURES: "1"
          BLOB_ROOT: ${{ runner.temp }}/issue310-blobs
        run: |
          set -euo pipefail
          cleanup() {
            scripts/disposable-test-services \
              --namespace "$TEST_NAMESPACE" down || true
          }
          trap cleanup EXIT

          eval "$(scripts/disposable-test-services \
            --namespace "$TEST_NAMESPACE" up)"
          export DATABASE_URL="$RESEARCH_STORE_TEST_DATABASE_URL"

          python -m pytest \
            -q \
            -ra \
            -p no:cacheprovider \
            --import-mode=importlib \
            tests/unit/test_issue310_research_controller.py \
            tests/unit/test_issue310_controller_policy_authority.py \
            tests/unit/test_issue313_operator_action_authority.py \
            tests/contract/test_issue310_fresearch_surface.py \
            tests/contract/test_issue313_operator_action_surface.py \
            tests/integration/test_issue310_research_controller.py \
            tests/integration/test_issue310_controller_policy_authority.py \
            tests/integration/test_issue313_operator_actions.py \
            tests/integration/test_issue305_soft_gate_resume.py \
            tests/integration/test_issue_215_completion_budget.py \
            tests/integration/test_asset_promotion_integration.py \
            tests/unit/test_issue307_typed_resume_dispatch.py \
            tests/unit/test_issue307_typed_temporal_boundary.py \
            tests/unit/test_orchestrator.py \
            tests/unit/test_workflow_service.py \
            tests/integration/test_acquisition_service.py \
            tests/integration/test_acquisition_authority.py \
            tests/integration/test_issue314_handoff_completion.py \
            tests/integration/test_issue315_minimal_agent_gate.py

          eval "$(scripts/disposable-test-services \
            --namespace "$TEST_NAMESPACE" reset-qdrant)"
          curl --fail --silent --show-error "$QDRANT_URL/readyz" >/dev/null

          scripts/disposable-test-services \
            --namespace "$TEST_NAMESPACE" down
          trap - EXIT

          if docker ps -a --format '{{.Names}}' \
            | grep -Eq "^${TEST_NAMESPACE}_(pg|qdrant)$"; then
            echo "helper-owned disposable containers remain after down" >&2
            exit 1
          fi

      - name: Write exact-head runtime evidence
        env:
          TEST_NAMESPACE: ${{ matrix.namespace }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          tested_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          evidence = {
              "schema_version": "research-controller-review-v1",
              "status": "passed",
              "base_sha": os.environ["BASE_SHA"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "tested_sha": tested_sha,
              "python": "${{ matrix.python-version }}",
              "test_namespace": os.environ["TEST_NAMESPACE"],
              "disposable_service_ack": (
                  "reference-read;helper-bound;namespace="
                  + os.environ["TEST_NAMESPACE"]
              ),
              "reset_qdrant": True,
              "cleanup_verified": True,
              "authorities": [
                  "controller-unit-contract-integration",
                  "controller-policy-directive-consistency",
                  "durable-operator-action-authority",
                  "atomic-curation-and-scope-lineage",
                  "resume-temporal-boundary",
                  "candidate-budget-and-membership-gates",
                  "low-level-lifecycle-acquisition",
                  "minimal-agent-epic-gate",
                  "completion-host-handoff",
                  "postgresql-disposable-helper",
                  "qdrant-reset-readyz",
              ],
          }
          path = Path(
              "research-controller-review-${{ matrix.python-version }}.json"
          )
          path.write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload exact-head runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: research-controller-review-${{ env.CANDIDATE_SHA }}-py${{ matrix.python-version }}
          path: research-controller-review-${{ matrix.python-version }}.json
          if-no-files-found: error
          retention-days: 90
