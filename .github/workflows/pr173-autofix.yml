name: PR 173 mechanical autofix

on:
  push:
    branches:
      - agent/issue-170-authoritative-campaign-dispatch

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: agent/issue-170-authoritative-campaign-dispatch
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install exact CI Ruff
        run: python -m pip install ruff==0.16.1

      - name: Apply mechanical source corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify_release_campaign.py")
          text = path.read_text(encoding="utf-8")
          text = text.removeprefix("#!/usr/bin/env python3\n")
          text = text.replace(
              "from typing import Any, Iterable, Mapping, Sequence\n",
              "from collections.abc import Iterable, Mapping, Sequence\n"
              "from typing import Any\n",
          )
          path.write_text(text, encoding="utf-8")
          PY
          ruff check --fix \
            scripts/run_release_campaign.py \
            scripts/verify_release_campaign.py \
            scripts/test_release_campaign_verifier.py
          ruff format \
            scripts/run_release_campaign.py \
            scripts/verify_release_campaign.py \
            scripts/test_release_campaign_verifier.py
          ruff check \
            scripts/run_release_campaign.py \
            scripts/verify_release_campaign.py \
            scripts/test_release_campaign_verifier.py
          ruff format --check \
            scripts/run_release_campaign.py \
            scripts/verify_release_campaign.py \
            scripts/test_release_campaign_verifier.py

      - name: Commit mechanical corrections
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No mechanical corrections required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/run_release_campaign.py \
            scripts/verify_release_campaign.py \
            scripts/test_release_campaign_verifier.py
          git commit -m "Apply Ruff corrections to release verifier"
          git push origin HEAD:agent/issue-170-authoritative-campaign-dispatch
