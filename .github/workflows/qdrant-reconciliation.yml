name: Qdrant reconciliation contract

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - rc/audit-16-qdrant-reconciliation-indexes

permissions:
  contents: read

jobs:
  reconcile:
    name: "Reconciliation — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-store.txt pytest

      - name: Start disposable PostgreSQL
        run: |
          docker run --name pg -d -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16-alpine
          sleep 5
          for i in $(seq 1 10); do
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres \
              -c "CREATE DATABASE firecrawl_reconcile_test;" 2>/dev/null && break || sleep 1
          done

      - name: Start disposable Qdrant
        run: |
          docker run --name qdrant -d -p 6333:6333 \
            -e QDRANT__SERVICE__READ_ONLY_ACCESS=false \
            qdrant/qdrant:v1.18.3-unprivileged
          sleep 3

      - name: Run reconciliation contracts
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1/firecrawl_reconcile_test"
          RESEARCH_STORE_TEST_ALLOW_RESET: "firecrawl_reconcile_test"
          QDRANT_URL: "http://127.0.0.1:6333"
          RESEARCH_STORE_TEST_QDRANT_URL: "http://127.0.0.1:6333"
          RESEARCH_STORE_TEST_QDRANT_ALLOW_RESET: "http://127.0.0.1:6333"
        run: |
          python -m pytest -q -p no:cacheprovider \
            scripts/test_qdrant_authority.py \
            scripts/test_qdrant_reconciliation_contract.py \
            scripts/test_qdrant_reconciliation_integration.py
