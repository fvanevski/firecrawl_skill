name: Direct scrape contract

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  direct-scrape:
    name: "Direct scrape — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check final diff
        run: git diff --check "origin/${GITHUB_BASE_REF:-main}...HEAD"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest

      - name: Start disposable PostgreSQL
        run: |
          docker run --name pg -d \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            postgres:16-alpine
          sleep 5
          for i in $(seq 1 10); do
            PGPASSWORD=postgres psql \
              -h 127.0.0.1 \
              -U postgres \
              -c "CREATE DATABASE firecrawl_direct_scrape_test;" \
              2>/dev/null && break || sleep 1
          done

      - name: Run direct scrape tests
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: >-
            postgresql://postgres:postgres@127.0.0.1/firecrawl_direct_scrape_test
          RESEARCH_STORE_TEST_ALLOW_RESET: firecrawl_direct_scrape_test
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_direct_scrape_service.py
