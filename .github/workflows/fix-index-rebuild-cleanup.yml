name: Fix index rebuild cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/remove-legacy-catalog' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/remove-legacy-catalog
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-store.txt pytest ruff==0.16.1
      - name: Correct cleanup dependency order
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/test_research_store_integration.py')
          text = path.read_text()
          start = text.index('class TestIndexRebuildRecovery:')
          end = text.find('\nclass ', start + 1)
          if end == -1:
              end = len(text)
          segment = text[start:end]
          marker = '            cur.execute("DELETE FROM documents;")\n'
          insertion = (
              '            cur.execute("DELETE FROM ingestion_batch_assets;")\n'
              + marker
          )
          if 'DELETE FROM ingestion_batch_assets;' not in segment:
              if segment.count(marker) != 1:
                  raise SystemExit('could not locate TestIndexRebuildRecovery cleanup marker')
              segment = segment.replace(marker, insertion, 1)
              text = text[:start] + segment + text[end:]
              path.write_text(text)
          PY
          ruff check scripts/test_research_store_integration.py
          ruff format --check scripts/test_research_store_integration.py
          python -m compileall -q scripts/test_research_store_integration.py
      - name: Start disposable services
        run: |
          docker run --name pg -d -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16-alpine
          sleep 5
          for i in $(seq 1 10); do
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE firecrawl_telemetry_test;" 2>/dev/null && break || sleep 1
          done
          docker run --name qdrant -d -p 6333:6333 -e QDRANT__SERVICE__READ_ONLY_ACCESS=false qdrant/qdrant:v1.18.3-unprivileged
          sleep 3
      - name: Run recovery integration class
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1/firecrawl_telemetry_test
          RESEARCH_STORE_TEST_ALLOW_RESET: firecrawl_telemetry_test
        run: |
          python -m pytest -q -p no:cacheprovider \
            scripts/test_research_store_integration.py::TestIndexRebuildRecovery
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test_research_store_integration.py
          git diff --cached --check
          git commit -m 'Fix index rebuild test cleanup order'
          git push origin HEAD:agent/remove-legacy-catalog
