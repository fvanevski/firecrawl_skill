name: Apply authoritative normalization query fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/remove-legacy-catalog' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/remove-legacy-catalog
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Align normalization queries with authoritative schema
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/research_store/cli.py')
          text = path.read_text()
          text = text.replace(
              'SELECT d.id, d.title, d.requested_url, d.content_sha256,',
              'SELECT d.id, d.title, snap.requested_url, d.document_sha256,',
          )
          text = text.replace(
              'FROM documents d\n                   JOIN document_blocks db ON db.document_id = d.id',
              'FROM documents d\n                   JOIN asset_snapshots snap ON snap.id = d.snapshot_id\n                   JOIN document_blocks db ON db.document_id = d.id',
          )
          if text.count('snap.requested_url, d.document_sha256') != 2:
              raise SystemExit('expected two authoritative normalization queries')
          path.write_text(text)
          PY
          python -m pip install ruff==0.16.1
          ruff check scripts/research_store/cli.py
          ruff format scripts/research_store/cli.py
          ruff check scripts/research_store/cli.py
          ruff format --check scripts/research_store/cli.py
          python -m compileall -q scripts/research_store/cli.py
      - name: Commit source correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/research_store/cli.py
          git commit -m 'Use authoritative normalization source metadata'
          git push origin HEAD:agent/remove-legacy-catalog
