name: Apply final PR 182 integration fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/remove-legacy-catalog' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/remove-legacy-catalog
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-store.txt pytest ruff==0.16.1
      - name: Apply validated corrections
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply_pr182.py
          python /tmp/apply_pr182.py
          ruff format scripts/research_store/invocation_events.py scripts/test_performance_telemetry_integration.py scripts/test_research_store_integration.py
          ruff check scripts/research_store/invocation_events.py scripts/test_performance_telemetry_integration.py scripts/test_research_store_integration.py
          ruff format --check scripts/research_store/invocation_events.py scripts/test_performance_telemetry_integration.py scripts/test_research_store_integration.py
          python -m compileall -q scripts/research_store/invocation_events.py scripts/test_performance_telemetry_integration.py scripts/test_research_store_integration.py
      - name: Start disposable services
        run: |
          docker run --name pg -d -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16-alpine
          sleep 5
          for i in $(seq 1 10); do
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE firecrawl_telemetry_test;" 2>/dev/null && break || sleep 1
          done
          docker run --name qdrant -d -p 6333:6333 -e QDRANT__SERVICE__READ_ONLY_ACCESS=false qdrant/qdrant:v1.18.3-unprivileged
          sleep 3
      - name: Run corrected integration contracts
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1/firecrawl_telemetry_test
          RESEARCH_STORE_TEST_ALLOW_RESET: firecrawl_telemetry_test
        run: |
          python -m pytest -q -p no:cacheprovider \
            scripts/test_performance_telemetry_integration.py::TestOverlappingCampaignCacheIsolation::test_overlapping_events_remain_exactly_run_scoped \
            scripts/test_research_store_integration.py::test_wrapper_workflow_runs_entirely_from_postgresql \
            scripts/test_research_store_integration.py::test_run_finish_handler_executes_through_service \
            scripts/test_research_store_integration.py::test_run_finish_idempotency_same_outcome \
            scripts/test_research_store_integration.py::test_run_reopen_after_finish_idempotency
      - name: Commit corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/research_store/invocation_events.py scripts/test_performance_telemetry_integration.py scripts/test_research_store_integration.py
          git diff --cached --check
          git commit -m 'Fix authoritative workflow integration contracts'
          git push origin HEAD:agent/remove-legacy-catalog
