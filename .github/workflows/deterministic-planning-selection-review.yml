name: Deterministic planning selection exact-head review

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/firecrawl_skill/research_store/query_policy.py"
      - "src/firecrawl_skill/research_store/candidate_selection_policy.py"
      - "src/firecrawl_skill/research_store/smart_search_application.py"
      - "src/firecrawl_skill/research_store/acquisition/temporal_acquisition.py"
      - "src/firecrawl_skill/research_store/planned_acquisition.py"
      - "src/firecrawl_skill/research_store/composition.py"
      - "scripts/research_workflow.py"
      - "scripts/fsearch_smart"
      - "schemas/research-workflow/search-query-proposal-v1.json"
      - "schemas/research-workflow/candidate-semantic-labels-v1.json"
      - "tests/unit/test_issue311_deterministic_policy.py"
      - "tests/unit/test_issue311_current_coverage_snapshot.py"
      - "tests/unit/test_issue311_preview_surface.py"
      - "tests/unit/test_issue311_review_remediation.py"
      - "tests/unit/test_issue311_acquisition_review_remediation.py"
      - "tests/unit/test_issue307_semantic_triage_temporal.py"
      - "tests/unit/test_issue307_smart_objective_intent.py"
      - "tests/unit/test_issue307_temporal_replay_stability.py"
      - "tests/unit/test_issue305_temporal_fallback.py"
      - "tests/integration/test_issue311_candidate_selection_integration.py"
      - "references/issue311-review-remediation.md"
      - ".github/workflows/deterministic-planning-selection-review.yml"
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: "Exact candidate commit SHA to validate"
        required: true
        type: string
      base-sha:
        description: "Exact implementation base SHA"
        required: true
        type: string

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate-sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base-sha }}

jobs:
  static-authorities:
    name: Deterministic planning static authorities
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify immutable identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git diff --check "$BASE_SHA...$CANDIDATE_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-research-store.txt
            requirements-typecheck.txt

      - name: Install static authorities
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            -r requirements-typecheck.txt \
            pytest \
            ruff
          ruff --version
          pyrefly --version

      - name: Determine changed Python scope
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR \
            "$BASE_SHA...$CANDIDATE_SHA" -- '*.py' \
            > "$RUNNER_TEMP/changed-python.txt"
          cat "$RUNNER_TEMP/changed-python.txt"

      - name: Ruff on changed Python scope
        run: |
          set -euo pipefail
          mapfile -t CHANGED_PY < "$RUNNER_TEMP/changed-python.txt"
          if ((${#CHANGED_PY[@]})); then
            ruff check "${CHANGED_PY[@]}"
            ruff format --check --diff "${CHANGED_PY[@]}"
          fi

      - name: Pyrefly on changed Python scope
        run: |
          set -euo pipefail
          mapfile -t CHANGED_PY < "$RUNNER_TEMP/changed-python.txt"
          if ((${#CHANGED_PY[@]})); then
            pyrefly check "${CHANGED_PY[@]}"
          fi

      - name: Full-project Pyrefly
        run: pyrefly check

  runtime-authorities:
    name: Deterministic planning runtime — Python ${{ matrix.python-version }}
    needs: static-authorities
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            namespace: issue311-py311
          - python-version: "3.12"
            namespace: issue311-py312

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify immutable identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install runtime authorities
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest

      - name: Bind repository-sanctioned disposable services
        env:
          TEST_NAMESPACE: ${{ matrix.namespace }}
        run: |
          set -euo pipefail
          test -s references/local-disposable-test-services.md
          cat references/local-disposable-test-services.md >/dev/null
          scripts/disposable-test-services --help >/dev/null
          echo "DISPOSABLE_SERVICE_ACK=reference-read;helper-bound;namespace=$TEST_NAMESPACE"

      - name: Run deterministic planner and candidate-policy authorities
        env:
          TEST_NAMESPACE: ${{ matrix.namespace }}
          EMBEDDING_MODEL: issue311-test
          EMBEDDING_REVISION: test
          EMBEDDING_DIMENSION: "4"
          FIRECRAWL_RELEASE_DETERMINISTIC_FIXTURES: "1"
          BLOB_ROOT: ${{ runner.temp }}/issue311-blobs
        run: |
          set -euo pipefail
          cleanup() {
            scripts/disposable-test-services \
              --namespace "$TEST_NAMESPACE" down || true
          }
          trap cleanup EXIT

          eval "$(scripts/disposable-test-services \
            --namespace "$TEST_NAMESPACE" up)"
          export DATABASE_URL="$RESEARCH_STORE_TEST_DATABASE_URL"

          python -m pytest \
            -q \
            -ra \
            -p no:cacheprovider \
            --import-mode=importlib \
            tests/unit/test_issue311_deterministic_policy.py \
            tests/unit/test_issue311_current_coverage_snapshot.py \
            tests/unit/test_issue311_preview_surface.py \
            tests/unit/test_issue311_review_remediation.py \
            tests/unit/test_issue311_acquisition_review_remediation.py \
            tests/unit/test_issue307_semantic_triage_temporal.py \
            tests/unit/test_issue307_smart_objective_intent.py \
            tests/unit/test_issue307_typed_temporal_boundary.py \
            tests/unit/test_issue307_temporal_replay_stability.py \
            tests/unit/test_issue305_temporal_fallback.py \
            tests/unit/test_issue302_fallback_temporal.py \
            tests/unit/test_issue310_research_controller.py \
            tests/integration/test_issue311_candidate_selection_integration.py \
            tests/integration/test_authoritative_smart_validation.py \
            tests/integration/test_issue307_temporal_replay_stability.py \
            tests/integration/test_issue300_temporal_acquisition.py \
            tests/integration/test_acquisition_service.py \
            tests/integration/test_acquisition_authority.py \
            tests/integration/test_orchestration_package.py

          eval "$(scripts/disposable-test-services \
            --namespace "$TEST_NAMESPACE" reset-qdrant)"
          curl --fail --silent --show-error "$QDRANT_URL/readyz" >/dev/null

          scripts/disposable-test-services \
            --namespace "$TEST_NAMESPACE" down
          trap - EXIT

          if docker ps -a --format '{{.Names}}' \
            | grep -Eq "^${TEST_NAMESPACE}_(pg|qdrant)$"; then
            echo "helper-owned disposable containers remain after down" >&2
            exit 1
          fi

      - name: Write exact-head runtime evidence
        env:
          TEST_NAMESPACE: ${{ matrix.namespace }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          tested_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          evidence = {
              "schema_version": "deterministic-planning-review-v1",
              "status": "passed",
              "base_sha": os.environ["BASE_SHA"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "tested_sha": tested_sha,
              "python": "${{ matrix.python-version }}",
              "test_namespace": os.environ["TEST_NAMESPACE"],
              "disposable_service_ack": (
                  "reference-read;helper-bound;namespace="
                  + os.environ["TEST_NAMESPACE"]
              ),
              "reset_qdrant": True,
              "cleanup_verified": True,
              "authorities": [
                  "semantic-query-proposal-boundary",
                  "deterministic-query-materialization",
                  "proposal-order-invariance",
                  "deterministic-candidate-selection",
                  "persisted-budget-planned-acquisition",
                  "global-extraction-budget-restart-authority",
                  "semantic-facet-provider-operation-separation",
                  "current-coverage-snapshot-authority",
                  "response-scoped-temporal-replay",
                  "controller-planning-compatibility",
                  "postgresql-disposable-helper",
                  "qdrant-reset-readyz",
              ],
          }
          path = Path(
              "deterministic-planning-review-${{ matrix.python-version }}.json"
          )
          path.write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload exact-head runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-planning-review-${{ env.CANDIDATE_SHA }}-py${{ matrix.python-version }}
          path: deterministic-planning-review-${{ matrix.python-version }}.json
          if-no-files-found: error
          retention-days: 90
