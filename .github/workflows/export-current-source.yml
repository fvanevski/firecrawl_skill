name: Diagnose current PR tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose-tests:
    if: github.head_ref == 'agent/remove-legacy-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/remove-legacy-catalog
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-research-store.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-store.txt pytest
      - name: Start disposable PostgreSQL
        run: |
          docker run --name pg -d -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16-alpine
          sleep 5
          for i in $(seq 1 10); do
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE firecrawl_telemetry_test;" 2>/dev/null && break || sleep 1
          done
      - name: Start disposable Qdrant
        run: |
          docker run --name qdrant -d -p 6333:6333 -e QDRANT__SERVICE__READ_ONLY_ACCESS=false qdrant/qdrant:v1.18.3-unprivileged
          sleep 3
      - name: Run until first failure
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1/firecrawl_telemetry_test
          RESEARCH_STORE_TEST_ALLOW_RESET: firecrawl_telemetry_test
        shell: bash
        run: |
          set +e
          python -m pytest -x -vv --tb=long -p no:cacheprovider scripts/ > "$RUNNER_TEMP/pytest.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/pytest.log"
          echo "$rc" > "$RUNNER_TEMP/pytest.rc"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostic-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/pytest.log
            ${{ runner.temp }}/pytest.rc
          if-no-files-found: error
          retention-days: 1
