name: Apply audit builder fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/remove-legacy-catalog' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/remove-legacy-catalog
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Correct audit builder authority handling
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/research_store/container.py')
          text = path.read_text()
          old = '''def build_audit_service(config: StoreConfig | None = None):
              """Build an AuditService wired to the PostgreSQL database."""
              # config may be a uow_factory partial from run_service; ignore it and
              # always read a fresh StoreConfig so monkeypatch-ed env vars are picked
              # up by tests.
              config = StoreConfig.from_env()
              config.require_database()
              from .service import AuditService

              return AuditService(
                  partial(
                      PostgresUnitOfWork,
                      config.database_url,
                      config.physical_collection,
                      config.embedding_model,
                      config.embedding_revision,
                      config.embedding_dimension,
                      config.parser_version,
                      config.normalization_version,
                      config.chunker_version,
                  )
              )
          '''
          new = '''def build_audit_service(config: StoreConfig | Any | None = None):
              """Build an AuditService from a store config or existing UoW factory."""
              from .service import AuditService

              if config is not None and not isinstance(config, StoreConfig):
                  return AuditService(config)

              resolved = config or StoreConfig.from_env()
              resolved.require_database()
              return AuditService(
                  partial(
                      PostgresUnitOfWork,
                      resolved.database_url,
                      resolved.physical_collection,
                      resolved.embedding_model,
                      resolved.embedding_revision,
                      resolved.embedding_dimension,
                      resolved.parser_version,
                      resolved.normalization_version,
                      resolved.chunker_version,
                  )
              )
          '''
          if old not in text:
              raise SystemExit('audit builder block not found')
          path.write_text(text.replace(old, new))
          PY
          python -m pip install ruff==0.16.1
          ruff check scripts/research_store/container.py
          ruff format --check scripts/research_store/container.py
          python -m compileall -q scripts/research_store/container.py
      - name: Commit source correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/research_store/container.py
          git commit -m 'Honor explicit audit service configuration'
          git push origin HEAD:agent/remove-legacy-catalog
