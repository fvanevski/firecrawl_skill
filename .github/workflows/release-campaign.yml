name: Real release campaign

on:
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: Exact current main SHA to validate
        required: true
        type: string
      ci-run-id:
        description: Completed exact-head ordinary CI workflow run ID
        required: true
        type: string
      ci-evidence-run-id:
        description: Workflow run containing the exact-head CI evidence artifact
        required: true
        type: string
      ci-evidence-sha256:
        description: SHA-256 of exact-head-ci-evidence.json
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  campaign:
    name: "Real release campaigns (issues #146/#153/#170)"
    runs-on: [self-hosted, firecrawl-release]
    timeout-minutes: 180
    environment: release-campaign
    env:
      CANDIDATE_SHA: ${{ inputs.candidate-sha }}
      CI_RUN_ID: ${{ inputs.ci-run-id }}
      CI_EVIDENCE_RUN_ID: ${{ inputs.ci-evidence-run-id }}
      CI_EVIDENCE_SHA256: ${{ inputs.ci-evidence-sha256 }}
      DISPATCH_SHA: ${{ github.sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      DISPATCH_REF: ${{ github.ref }}
      CAMPAIGN_DIR: ${{ runner.temp }}/release-campaign-${{ inputs.candidate-sha }}
      SMOKE_DISABLE_AGENT_LED: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate-sha }}
          fetch-depth: 0

      - name: Verify exact-head workflow identity
        shell: bash
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = "refs/heads/main"
          test "$DISPATCH_SHA" = "$CANDIDATE_SHA"
          test "$WORKFLOW_SHA" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$SMOKE_DISABLE_AGENT_LED" = "1"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Retrieve completed exact-head CI evidence
        id: ci_evidence
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$CAMPAIGN_DIR/exact-head-ci"
          mkdir -p "$EVIDENCE_DIR"
          gh run view "$CI_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,conclusion,status,headSha,url,jobs \
            > "$EVIDENCE_DIR/ci-run-observed.json"
          gh run download "$CI_EVIDENCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "exact-head-ci-evidence-$CANDIDATE_SHA" \
            --dir "$EVIDENCE_DIR"
          EVIDENCE_PATH="$EVIDENCE_DIR/exact-head-ci-evidence.json"
          test -f "$EVIDENCE_PATH"
          OBSERVED_SHA=$(sha256sum "$EVIDENCE_PATH" | cut -d' ' -f1)
          test "$OBSERVED_SHA" = "$CI_EVIDENCE_SHA256"
          echo "path=$EVIDENCE_PATH" >> "$GITHUB_OUTPUT"

      - name: Set up isolated Python
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          command -v python3.12
          python3.12 --version
          command -v uv
          uv venv --python python3.12 --seed "$RUNNER_TEMP/release-campaign-venv"
          echo "$RUNNER_TEMP/release-campaign-venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-store.txt

      - name: Execute two strict campaigns
        id: execute
        if: steps.ci_evidence.outcome == 'success'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_ROOT: ${{ secrets.BLOB_ROOT }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_ALIAS: ${{ vars.QDRANT_ALIAS }}
          FIRECRAWL_API_URL: ${{ secrets.FIRECRAWL_API_URL }}
          EMBEDDING_URL: ${{ secrets.EMBEDDING_URL }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          GENERATIVE_URL: ${{ secrets.GENERATIVE_URL }}
          GENERATIVE_API_KEY: ${{ secrets.GENERATIVE_API_KEY }}
          GENERATIVE_MODEL: ${{ vars.GENERATIVE_MODEL }}
          RERANKER_URL: ${{ secrets.RERANKER_URL }}
          RERANKER_API_KEY: ${{ secrets.RERANKER_API_KEY }}
          RERANKER_MODEL: ${{ vars.RERANKER_MODEL }}
          PYTHONPATH: scripts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_release_campaign.py \
            --candidate-sha "$CANDIDATE_SHA" \
            --campaign-dir "$CAMPAIGN_DIR"

      - name: Verify authoritative campaign evidence
        id: verify
        if: always()
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: scripts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_release_campaign_ci.py \
            --campaign-dir "$CAMPAIGN_DIR" \
            --database-url "$DATABASE_URL" \
            --candidate-sha "$CANDIDATE_SHA" \
            --dispatch-sha "$DISPATCH_SHA" \
            --workflow-sha "$WORKFLOW_SHA" \
            --dispatch-ref "$DISPATCH_REF" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --execution-conclusion "${{ steps.execute.outcome }}" \
            --ci-evidence "$CAMPAIGN_DIR/exact-head-ci/exact-head-ci-evidence.json" \
            --ci-evidence-sha256 "$CI_EVIDENCE_SHA256" \
            --ci-run-id "$CI_RUN_ID" \
            --ci-evidence-run-id "$CI_EVIDENCE_RUN_ID"

      - name: Ensure a durable failure manifest exists
        id: manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CAMPAIGN_DIR"
          MANIFEST="$CAMPAIGN_DIR/release-evidence-manifest.json"
          python scripts/ensure_release_failure_manifest.py \
            --manifest "$MANIFEST" \
            --candidate-sha "$CANDIDATE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --ci-run-id "$CI_RUN_ID" \
            --ci-evidence-run-id "$CI_EVIDENCE_RUN_ID" \
            --ci-evidence-sha256 "$CI_EVIDENCE_SHA256"
          MANIFEST_SHA=$(sha256sum "$MANIFEST" | cut -d' ' -f1)
          echo "path=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "sha256=$MANIFEST_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload complete campaign directory
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-release-campaign-${{ inputs.candidate-sha }}
          path: ${{ runner.temp }}/release-campaign-${{ inputs.candidate-sha }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish durable closure evidence
        id: publish
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          COMMENT_FILE="$RUNNER_TEMP/release-evidence-comment.md"
          python scripts/render_release_evidence_comment.py \
            --manifest "${{ steps.manifest.outputs.path }}" \
            --manifest-sha256 "${{ steps.manifest.outputs.sha256 }}" \
            --artifact-id "${{ steps.upload.outputs.artifact-id }}" \
            --artifact-url "${{ steps.upload.outputs.artifact-url }}" \
            --artifact-digest "${{ steps.upload.outputs.artifact-digest }}" \
            --output "$COMMENT_FILE"
          for issue in 170 153 146; do
            gh issue comment "$issue" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$COMMENT_FILE"
          done

      - name: Record artifact upload identity
        if: always()
        shell: bash
        run: |
          {
            echo "artifact_id=${{ steps.upload.outputs.artifact-id }}"
            echo "artifact_url=${{ steps.upload.outputs.artifact-url }}"
            echo "artifact_digest=${{ steps.upload.outputs.artifact-digest }}"
            echo "candidate_sha=$CANDIDATE_SHA"
            echo "workflow_sha=$WORKFLOW_SHA"
            echo "ci_run_id=$CI_RUN_ID"
            echo "ci_evidence_run_id=$CI_EVIDENCE_RUN_ID"
            echo "ci_evidence_sha256=$CI_EVIDENCE_SHA256"
            echo "manifest_sha256=${{ steps.manifest.outputs.sha256 }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Enforce authoritative gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.ci_evidence.outcome }}" = "success"
          test "${{ steps.execute.outcome }}" = "success"
          test "${{ steps.verify.outcome }}" = "success"
          test "${{ steps.upload.outcome }}" = "success"
          test "${{ steps.publish.outcome }}" = "success"
