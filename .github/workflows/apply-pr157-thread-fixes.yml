name: Apply PR 157 review-thread fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-pr157-thread-fixes:
    if: github.head_ref == 'agent/issue-170-resolve-pr157-threads'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out follow-up branch
        uses: actions/checkout@v7
        with:
          ref: agent/issue-170-resolve-pr157-threads
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-store.txt pytest ruff

      - name: Apply guarded source corrections
        id: apply
        run: |
          if grep -q 'STRICT_MIN_CPU_SAMPLES = 2' scripts/research_store/release_benchmark.py; then
            echo 'Source corrections already applied.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            sha256sum scripts/_pr157_patch_parts/part-*
            cat scripts/_pr157_patch_parts/part-* \
              > scripts/_apply_pr157_thread_fixes.py
            sha256sum scripts/_apply_pr157_thread_fixes.py
            echo '1b0c3e85b97230ada1401ebc680d3212c74cdc4770c4904bb5ec2d89f712d63f  scripts/_apply_pr157_thread_fixes.py' \
              | sha256sum --check --strict
            python scripts/_apply_pr157_thread_fixes.py
            rm scripts/_apply_pr157_thread_fixes.py
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate formatting and lint
        run: |
          ruff format \
            scripts/research_store/resource_sampler.py \
            scripts/research_store/release_benchmark.py \
            scripts/test_performance_telemetry.py \
            scripts/test_release_invariant_contracts.py
          ruff check \
            scripts/research_store/resource_sampler.py \
            scripts/research_store/release_benchmark.py \
            scripts/test_performance_telemetry.py \
            scripts/test_release_invariant_contracts.py

      - name: Run exact regression suites
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_performance_telemetry.py \
            scripts/test_release_invariant_contracts.py \
            scripts/test_release_benchmark.py \
            scripts/test_strict_campaign.py \
            scripts/test_documentation.py

      - name: Commit validated corrections
        if: steps.apply.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            references/strict-campaign-operations.md \
            scripts/research_store/resource_sampler.py \
            scripts/research_store/release_benchmark.py \
            scripts/test_performance_telemetry.py \
            scripts/test_release_invariant_contracts.py
          git commit -m 'fix: complete strict telemetry review contracts'
          git push origin HEAD:agent/issue-170-resolve-pr157-threads
