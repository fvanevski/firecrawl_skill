name: Issue 212 fixture repair

on:
  push:
    branches:
      - rc/audit-06-curated-run-lifecycle
    paths:
      - .github/workflows/issue-212-fixture-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: rc/audit-06-curated-run-lifecycle
          fetch-depth: 0

      - name: Apply exact fixture repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "scripts/test_authoritative_fsearch.py",
              "    from research_store.container import build_run_service\n",
              "    from research_store.container import (\n"
              "        build_run_service,\n"
              "        build_workflow_operation_service,\n"
              "    )\n",
          )
          replace_once(
              "scripts/test_authoritative_fsearch.py",
              "    run = run_service.create(\n"
              "        objective=\"authoritative fsearch idempotency\",\n"
              "        external_id=external_run_id,\n"
              "    )\n"
              "    adapter = _SuccessfulSearchAdapter()\n",
              "    run = run_service.create(\n"
              "        objective=\"authoritative fsearch idempotency\",\n"
              "        external_id=external_run_id,\n"
              "    )\n"
              "    build_workflow_operation_service(config).prepare_run(external_run_id)\n"
              "    adapter = _SuccessfulSearchAdapter()\n",
          )

          replace_once(
              "scripts/test_authoritative_fsearch_review.py",
              "    from research_store.container import build_run_service\n",
              "    from research_store.container import (\n"
              "        build_run_service,\n"
              "        build_workflow_operation_service,\n"
              "    )\n",
          )
          replace_once(
              "scripts/test_authoritative_fsearch_review.py",
              "    run = service.create(objective=objective, external_id=external_id)\n"
              "    return service, run, external_id\n",
              "    run = service.create(objective=objective, external_id=external_id)\n"
              "    build_workflow_operation_service(config).prepare_run(external_id)\n"
              "    return service, run, external_id\n",
          )

          replace_once(
              "scripts/test_authoritative_fscrape.py",
              "from research_store.container import build_run_service\n",
              "from research_store.container import (\n"
              "    build_run_service,\n"
              "    build_workflow_operation_service,\n"
              ")\n",
          )
          replace_once(
              "scripts/test_authoritative_fscrape.py",
              "    run_service.create(\n"
              "        objective=\"authoritative fscrape integration\",\n"
              "        external_id=run_external_id,\n"
              "    )\n"
              "    schema = {\n",
              "    run_service.create(\n"
              "        objective=\"authoritative fscrape integration\",\n"
              "        external_id=run_external_id,\n"
              "    )\n"
              "    build_workflow_operation_service(config).prepare_run(run_external_id)\n"
              "    schema = {\n",
          )

          old_workflow_test = '''def test_workflow_rejects_finish_and_followup_before_drain() -> None:
              from research_store.workflow_service import (
                  RunIndexProgress,
                  WorkflowBoundaryError,
                  WorkflowOperationService,
              )

              run_id = UUID(int=1)
              service = WorkflowOperationService.__new__(WorkflowOperationService)
              service.run_service = SimpleNamespace(
                  status=lambda **_kwargs: SimpleNamespace(id=run_id, state="indexing")
              )
              service.invocation_service = SimpleNamespace()
              service.index_progress = lambda _run_id: RunIndexProgress(
                  assets=1,
                  chunks=2,
                  pending=1,
                  running=0,
                  failed=0,
                  dead=0,
                  complete=1,
              )

              with pytest.raises(
                  WorkflowBoundaryError,
                  match="cannot resume acquisition while indexing is incomplete",
              ):
                  service.begin_operation(RUN_ID, INVOCATION_ID, "fscrape", {})

              with pytest.raises(
                  WorkflowBoundaryError,
                  match="run indexing is not complete",
              ):
                  service.finish_run(RUN_ID, outcome="satisfied")
          '''
          new_workflow_test = '''def test_workflow_rejects_finish_and_direct_followup_during_indexing() -> None:
              from research_store.workflow_service import (
                  RunIndexProgress,
                  WorkflowBoundaryError,
                  WorkflowOperationService,
              )

              run_id = UUID(int=1)
              service = WorkflowOperationService.__new__(WorkflowOperationService)
              service.run_service = SimpleNamespace(
                  status=lambda **_kwargs: SimpleNamespace(id=run_id, state="indexing")
              )
              service.invocation_service = SimpleNamespace()
              progress_calls = 0

              def incomplete_progress(_run_id):
                  nonlocal progress_calls
                  progress_calls += 1
                  return RunIndexProgress(
                      assets=1,
                      chunks=2,
                      pending=1,
                      running=0,
                      failed=0,
                      dead=0,
                      complete=1,
                  )

              service.index_progress = incomplete_progress

              with pytest.raises(
                  WorkflowBoundaryError,
                  match="cannot begin fscrape.*state indexing.*frun prepare",
              ):
                  service.begin_operation(RUN_ID, INVOCATION_ID, "fscrape", {})
              assert progress_calls == 0

              with pytest.raises(
                  WorkflowBoundaryError,
                  match="run indexing is not complete",
              ):
                  service.finish_run(RUN_ID, outcome="satisfied")
              assert progress_calls == 1
          '''
          replace_once(
              "scripts/test_documented_workflows.py",
              old_workflow_test,
              new_workflow_test,
          )
          PY

      - name: Validate repaired sources
        shell: bash
        run: |
          python3 -m compileall -q \
            scripts/test_authoritative_fsearch.py \
            scripts/test_authoritative_fsearch_review.py \
            scripts/test_authoritative_fscrape.py \
            scripts/test_documented_workflows.py
          git diff --check

      - name: Commit fixture repair and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/issue-212-fixture-repair.yml
          git config user.name "ChatGPT implementation"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/test_authoritative_fsearch.py \
            scripts/test_authoritative_fsearch_review.py \
            scripts/test_authoritative_fscrape.py \
            scripts/test_documented_workflows.py
          git commit -m "test(research): prepare authoritative wrapper fixtures"
          git push origin HEAD:rc/audit-06-curated-run-lifecycle
