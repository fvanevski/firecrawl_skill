name: Issue 170 follow-up fixer

on:
  push:
    branches:
      - agent/issue-170-authoritative-extraction-evidence
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/issue-170-authoritative-extraction-evidence
          fetch-depth: 0

      - name: Apply authoritative follow-up fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"{path}: expected one replacement target, found {count}: {old[:100]!r}"
                  )
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          # -----------------------------------------------------------------
          # Local structured output: disable Qwen thinking by default and
          # preserve the setting plus reasoning_content in diagnostics.
          # -----------------------------------------------------------------
          path = "scripts/model_gateway.py"
          replace_once(
              path,
              '''            "reasoning_excerpt": _redact(message.get("reasoning", ""))[
                          :MAX_RAW_EXCERPT
                      ],''',
              '''            "reasoning_excerpt": _redact(
                          message.get("reasoning")
                          or message.get("reasoning_content")
                          or ""
                      )[:MAX_RAW_EXCERPT],''',
          )
          replace_once(
              path,
              '''    semantic_persistence=None,
              semantic_context=None,
          ):''',
              '''    semantic_persistence=None,
              semantic_context=None,
              enable_thinking=False,
          ):''',
          )
          replace_once(
              path,
              '''                "seed": 0,
                          "max_tokens": output_budget,
                          "messages": [''',
              '''                "seed": 0,
                          "max_tokens": output_budget,
                          "chat_template_kwargs": {
                              "enable_thinking": bool(enable_thinking),
                          },
                          "messages": [''',
          )
          file = Path(path)
          text = file.read_text(encoding="utf-8")
          target = '''                    "structured_mode": structured_mode,
          '''
          count = text.count(target)
          if count < 2:
              raise RuntimeError(f"{path}: expected multiple attempt dictionaries, found {count}")
          text = text.replace(
              target,
              '''                    "structured_mode": structured_mode,
                              "thinking_enabled": (
                                  bool(enable_thinking)
                                  if config["api_surface"] == "chat_completions"
                                  else None
                              ),
          ''',
          )
          target = '''                    "seed": 0 if config["api_surface"] == "chat_completions" else None,
          '''
          count = text.count(target)
          if count != 2:
              raise RuntimeError(f"{path}: expected two provenance seed fields, found {count}")
          text = text.replace(
              target,
              '''                    "seed": 0 if config["api_surface"] == "chat_completions" else None,
                              "thinking_enabled": (
                                  bool(enable_thinking)
                                  if config["api_surface"] == "chat_completions"
                                  else None
                              ),
          ''',
          )
          file.write_text(text, encoding="utf-8")

          # -----------------------------------------------------------------
          # Preflight output: never echo URL credentials.
          # -----------------------------------------------------------------
          path = "scripts/research_store/preflight.py"
          replace_once(
              path,
              '''from pathlib import Path
          from uuid import UUID, uuid4
          ''',
              '''from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit
          from uuid import UUID, uuid4
          ''',
          )
          replace_once(
              path,
              '''def probe_valkey(valkey_url: str) -> str:
          ''',
              '''def _redact_url_credentials(value: str) -> str:
              """Return a service URL with any password replaced by ``***``."""
              try:
                  parts = urlsplit(value)
              except (TypeError, ValueError):
                  return "<redacted-service-url>"
              if parts.password is None or "@" not in parts.netloc:
                  return value
              userinfo, hostinfo = parts.netloc.rsplit("@", 1)
              username = userinfo.split(":", 1)[0]
              return urlunsplit(
                  (
                      parts.scheme,
                      f"{username}:***@{hostinfo}",
                      parts.path,
                      parts.query,
                      parts.fragment,
                  )
              )


          def probe_valkey(valkey_url: str) -> str:
          ''',
          )
          replace_once(
              path,
              '''    return f"Valkey ({valkey_url}): isolated exact-token round-trip OK"
          ''',
              '''    safe_url = _redact_url_credentials(valkey_url)
              return f"Valkey ({safe_url}): isolated exact-token round-trip OK"
          ''',
          )

          # -----------------------------------------------------------------
          # Index build/reconciliation: PostgreSQL completion is insufficient
          # when the physical Qdrant point is absent. Requeue missing jobs and
          # allow explicit reconcile repair to remove current-derivation
          # orphans before rebuilding.
          # -----------------------------------------------------------------
          path = "scripts/research_store/cli.py"
          replace_once(
              path,
              '''def _index_build(config, document_id=None):
          ''',
              '''def _index_build(config, document_id=None, *, repair_orphans=False):
          ''',
          )
          replace_once(
              path,
              '''        if not offset:
                      break
              with _db(config) as conn, conn.cursor() as cur:
          ''',
              '''        if not offset:
                      break
              missing_chunk_ids = selected_chunk_ids - indexed_ids
              orphaned_chunk_ids = (
                  indexed_ids - selected_chunk_ids if document_id is None else set()
              )
              deleted_orphaned = 0
              if repair_orphans and orphaned_chunk_ids:
                  index.delete(sorted(orphaned_chunk_ids, key=str))
                  deleted_orphaned = len(orphaned_chunk_ids)
              with _db(config) as conn, conn.cursor() as cur:
          ''',
          )
          replace_once(
              path,
              '''        manifests = cur.fetchall()
                  manifest_ids = [row[0] for row in manifests]
                  requeue_ids = [row[0] for row in manifests if row[2] != "complete"]
                  cur.execute(
          ''',
              '''        manifests = cur.fetchall()
                  manifest_ids = [row[0] for row in manifests]
                  if manifest_ids:
                      cur.execute(
                          """SELECT manifest_id FROM index_jobs
                          WHERE manifest_id=ANY(%s) AND operation='upsert'""",
                          (manifest_ids,),
                      )
                      job_manifest_ids = {row[0] for row in cur.fetchall()}
                  else:
                      job_manifest_ids = set()
                  missing_job_manifest_ids = set(manifest_ids) - job_manifest_ids
                  requeue_ids = [
                      row[0]
                      for row in manifests
                      if row[2] != "complete"
                      or row[1] in missing_chunk_ids
                      or row[0] in missing_job_manifest_ids
                  ]
                  cur.execute(
          ''',
          )
          replace_once(
              path,
              '''    queue = ValkeyQueue(config.valkey_url)
              if manifest_ids:
                  queue.notify(manifest_ids[0])
              return {
                  "index_definition": definition,
                  "selected_chunks": len(manifest_ids),
                  "scheduled": len(requeue_ids),
                  "qdrant_schema": schema,
              }
          ''',
              '''    queue = ValkeyQueue(config.valkey_url)
              if requeue_ids:
                  queue.notify(requeue_ids[0])
              return {
                  "index_definition": definition,
                  "selected_chunks": len(manifest_ids),
                  "scheduled": len(requeue_ids),
                  "missing_points": len(missing_chunk_ids),
                  "orphaned_points": len(orphaned_chunk_ids),
                  "deleted_orphaned": deleted_orphaned,
                  "missing_jobs": len(missing_job_manifest_ids),
                  "qdrant_schema": schema,
              }
          ''',
          )

          # Inspect the configured completed collection even when no alias
          # currently reaches it. This is the state that blocked activation.
          replace_once(
              path,
              '''    # Check all definitions for manifest/job mismatches, even those without
              # a Qdrant alias (e.g. definitions with manifests but no jobs yet).
          ''',
              '''    current_definition = next(
                  (
                      row
                      for row in definitions
                      if row["fingerprint"] == config.embedding_fingerprint
                      and row["physical_collection"] == config.physical_collection
                  ),
                  None,
              )
              if (
                  current_definition is not None
                  and current_definition["physical_collection"]
                  not in qdrant["collections"]
              ):
                  def_id = current_definition["id"]
                  manifest_info = manifests_by_def.get(def_id, {})
                  if total_chunks and manifest_info.get("complete", 0) == total_chunks:
                      collection_name = current_definition["physical_collection"]
                      try:
                          index = _qdrant(
                              config,
                              collection_name,
                              current_definition["dimension"],
                              current_definition["distance_metric"],
                          )
                          schema = index.inspect_schema()
                          point_ids, offset = set(), None
                          while True:
                              page = index.point_ids(
                                  offset, filters=_derivation_filter(config)
                              )
                              point_ids.update(
                                  str(item["id"]) for item in page.get("points", [])
                              )
                              offset = page.get("next_page_offset")
                              if not offset:
                                  break
                          chunk_ids = {
                              str(value) for value in _active_chunk_ids(config)
                          }
                          missing = chunk_ids - point_ids
                          orphaned = point_ids - chunk_ids
                          cached = point_counts.get(def_id)
                          qdrant["collections"][collection_name] = {
                              "aliases": [],
                              "schema": schema,
                              "point_count": len(point_ids),
                              "cached_point_count": (
                                  cached["count"] if cached else None
                              ),
                              "coverage": {
                                  "missing": len(missing),
                                  "orphaned": len(orphaned),
                              },
                              "has_discrepancies": bool(missing or orphaned),
                          }
                          if missing:
                              discrepancies.append(
                                  f"collection {collection_name}: "
                                  f"{len(missing)} missing points"
                              )
                              definitions_with_discrepancies.add(def_id)
                          if orphaned:
                              discrepancies.append(
                                  f"collection {collection_name}: "
                                  f"{len(orphaned)} orphaned points"
                              )
                              definitions_with_discrepancies.add(def_id)
                      except Exception as exc:  # noqa: BLE001
                          qdrant["collections"][collection_name] = {
                              "aliases": [],
                              "status": "error",
                              "error": str(exc),
                          }
                          discrepancies.append(
                              f"Qdrant collection {collection_name}: {exc}"
                          )
                          definitions_with_discrepancies.add(def_id)

              # Check all definitions for manifest/job mismatches, even those without
              # a Qdrant alias (e.g. definitions with manifests but no jobs yet).
          ''',
          )

          old_repair = '''    # Repair: re-run index-build only for definitions that have discrepancies.
              repaired = []
              if repair and discrepancies:
                  for defn in definitions:
                      def_id = defn["id"]
                      # Only repair definitions that actually have discrepancies.
                      if def_id not in definitions_with_discrepancies:
                          continue
                      try:
                          _index_build(config, document_id=None)
                          repaired.append(def_id)
                      except Exception as exc:  # noqa: BLE001
                          discrepancies.append(f"repair failed for {def_id}: {exc}")
                  # Re-run reconciliation against the repaired authoritative records,
                  # preserving the repaired list from this pass.  Deleting those records
                  # here would discard the jobs that ``_index_build`` just recreated and
                  # make a successful repair look like an empty index.
                  result = _index_reconcile(config, repair=False)
                  result["repaired"] = repaired
                  return result
          '''
          new_repair = '''    # Explicit repair always reconciles the currently configured
              # fingerprint. This also repairs physical drift that PostgreSQL alone
              # cannot reveal, including complete manifests with absent points.
              repaired = []
              repair_actions = []
              repair_errors = []
              if repair:
                  current_definition = next(
                      (
                          row
                          for row in definitions
                          if row["fingerprint"] == config.embedding_fingerprint
                          and row["physical_collection"] == config.physical_collection
                      ),
                      None,
                  )
                  if current_definition is None:
                      repair_errors.append(
                          "repair requires an index definition matching the current "
                          "embedding fingerprint"
                      )
                  else:
                      try:
                          action = _index_build(
                              config,
                              document_id=None,
                              repair_orphans=True,
                          )
                          repair_actions.append(action)
                          if action["scheduled"] or action["deleted_orphaned"]:
                              repaired.append(current_definition["id"])
                      except Exception as exc:  # noqa: BLE001
                          repair_errors.append(
                              f"repair failed for {current_definition['id']}: {exc}"
                          )
                  result = _index_reconcile(config, repair=False)
                  result["repaired"] = repaired
                  result["repair_actions"] = repair_actions
                  result["repair_errors"] = repair_errors
                  if repair_errors:
                      result["discrepancies"].extend(repair_errors)
                      result["ok"] = False
                  return result
          '''
          replace_once(path, old_repair, new_repair)

          # -----------------------------------------------------------------
          # Regression tests.
          # -----------------------------------------------------------------
          path = "scripts/test_preflight.py"
          file = Path(path)
          text = file.read_text(encoding="utf-8")
          marker = '''def test_probe_qdrant_uses_active_alias_and_named_dense_vector(monkeypatch):
          '''
          test = '''def test_redact_url_credentials_masks_password_without_changing_endpoint():
              assert preflight._redact_url_credentials(
                  "redis://research_app:p%40ss@127.0.0.1:56379/0"
              ) == "redis://research_app:***@127.0.0.1:56379/0"
              assert (
                  preflight._redact_url_credentials("redis://127.0.0.1:56379/0")
                  == "redis://127.0.0.1:56379/0"
              )


          '''
          if marker not in text:
              raise RuntimeError(f"{path}: test insertion marker missing")
          file.write_text(text.replace(marker, test + marker, 1), encoding="utf-8")

          path = "scripts/test_release_invariant_contracts.py"
          file = Path(path)
          text = file.read_text(encoding="utf-8")
          if "test_local_structured_gateway_disables_thinking_by_default" in text:
              raise RuntimeError(f"{path}: structured gateway regression already exists")
          text += '''

          def test_local_structured_gateway_disables_thinking_by_default(monkeypatch):
              import model_gateway

              captured = {}

              monkeypatch.setattr(
                  model_gateway,
                  "probe_local",
                  lambda *_args, **_kwargs: {"status": "available", "models": ["chat"]},
              )

              def request_json(url, payload, headers, timeout):
                  captured.update(
                      {"url": url, "payload": payload, "headers": headers, "timeout": timeout}
                  )
                  return (
                      {
                          "id": "request-1",
                          "model": "chat",
                          "choices": [
                              {
                                  "finish_reason": "stop",
                                  "message": {
                                      "content": '{"status":"ok"}',
                                      "reasoning_content": "hidden reasoning",
                                  },
                              }
                          ],
                          "usage": {"completion_tokens": 4},
                      },
                      "request-1",
                      200,
                  )

              monkeypatch.setattr(model_gateway, "_request_json", request_json)
              result = model_gateway.call_structured(
                  provider="local",
                  model="chat",
                  system_prompt="Return JSON.",
                  user_prompt='{"status":"ok"}',
                  schema={
                      "type": "object",
                      "additionalProperties": False,
                      "properties": {"status": {"const": "ok"}},
                      "required": ["status"],
                  },
                  max_attempts=1,
              )

              assert result.error == ""
              assert result.value == {"status": "ok"}
              assert captured["payload"]["chat_template_kwargs"] == {
                  "enable_thinking": False
              }
              assert result.attempts[0]["thinking_enabled"] is False
              assert result.attempts[0]["reasoning_excerpt"] == "hidden reasoning"
              assert result.provenance["thinking_enabled"] is False
          '''
          file.write_text(text, encoding="utf-8")

          path = "scripts/test_research_store_integration.py"
          replace_once(
              path,
              '''        # Re-run index-build — should only requeue the pending manifest
                  result2 = _index_build(config)
                  assert result2["selected_chunks"] == 2
                  assert result2["scheduled"] == 1  # Only the pending one
          ''',
              '''        # Re-run index-build. The manifest marked complete has no
                  # corresponding physical Qdrant point, so both manifests must be
                  # requeued rather than trusting PostgreSQL completion alone.
                  result2 = _index_build(config)
                  assert result2["selected_chunks"] == 2
                  assert result2["scheduled"] == 2
                  assert result2["missing_points"] == 2
          ''',
          )
          file = Path(path)
          text = file.read_text(encoding="utf-8")
          marker = '''    def test_index_point_counts_cached(self, service):
          '''
          test = '''    def test_index_reconcile_repair_requeues_missing_points_and_deletes_orphans(
                  self, service
              ):
                  from research_store.cli import _index_build, _index_reconcile, _qdrant
                  from research_store.config import StoreConfig
                  from research_store.postgres import connect

                  TEST_DSN = os.environ["RESEARCH_STORE_TEST_DATABASE_URL"]
                  with connect(TEST_DSN) as conn, conn.cursor() as cur:
                      cur.execute(
                          "INSERT INTO sources(canonical_url) VALUES (%s) RETURNING id",
                          ("https://physical-drift.example/test",),
                      )
                      source_id = cur.fetchone()[0]
                      cur.execute(
                          """INSERT INTO asset_snapshots(
                              source_id,requested_url,retrieved_at,content_sha256
                          ) VALUES (%s,%s,now(),%s) RETURNING id""",
                          (
                              source_id,
                              "https://physical-drift.example/test",
                              "1" * 64,
                          ),
                      )
                      snapshot_id = cur.fetchone()[0]
                      cur.execute(
                          """INSERT INTO documents(
                              snapshot_id,normalized_text,parser_name,parser_version,
                              normalization_version,document_sha256
                          ) VALUES (%s,%s,%s,%s,%s,%s) RETURNING id""",
                          (
                              snapshot_id,
                              "physical drift",
                              "markdown",
                              "markdown-v1",
                              "cleanup-v1",
                              "2" * 64,
                          ),
                      )
                      document_id = cur.fetchone()[0]
                      cur.execute(
                          """INSERT INTO chunks(
                              document_id,ordinal,text,content_sha256,
                              chunker_name,chunker_version
                          ) VALUES (%s,0,%s,%s,%s,%s) RETURNING id""",
                          (
                              document_id,
                              "physical drift chunk",
                              "3" * 64,
                              "structural",
                              "structural-v1",
                          ),
                      )
                      chunk_id = cur.fetchone()[0]

                  config = replace(
                      StoreConfig.from_env(),
                      database_url=TEST_DSN,
                      embedding_dimension=4,
                      parser_version="markdown-v1",
                      normalization_version="cleanup-v1",
                      chunker_version="structural-v1",
                  )
                  build = _index_build(config)
                  definition = build["index_definition"]
                  with connect(TEST_DSN) as conn, conn.cursor() as cur:
                      cur.execute(
                          """UPDATE embedding_manifests
                          SET index_status='complete',indexed_at=now()
                          WHERE index_definition_id=%s""",
                          (definition["id"],),
                      )
                      cur.execute(
                          """UPDATE index_jobs SET status='complete',completed_at=now()
                          WHERE index_definition_id=%s""",
                          (definition["id"],),
                      )

                  index = _qdrant(
                      config,
                      definition["physical_collection"],
                      definition["dimension"],
                      definition["distance_metric"],
                  )
                  orphan_id = uuid4()
                  index.upsert(
                      [
                          {
                              "id": str(orphan_id),
                              "vector": {"dense": [1.0, 0.0, 0.0, 0.0]},
                              "payload": {
                                  "parser_version": config.parser_version,
                                  "normalization_version": config.normalization_version,
                                  "chunker_version": config.chunker_version,
                              },
                          }
                      ]
                  )

                  before = _index_reconcile(config, repair=False)
                  assert before["ok"] is False
                  collection = before["qdrant"]["collections"][
                      definition["physical_collection"]
                  ]
                  assert collection["coverage"] == {"missing": 1, "orphaned": 1}

                  repaired = _index_reconcile(config, repair=True)
                  action = repaired["repair_actions"][0]
                  assert action["scheduled"] == 1
                  assert action["missing_points"] == 1
                  assert action["deleted_orphaned"] == 1
                  assert repaired["repaired"] == [str(definition["id"])]

                  with connect(TEST_DSN) as conn, conn.cursor() as cur:
                      cur.execute(
                          """SELECT m.index_status,j.status
                          FROM embedding_manifests m
                          JOIN index_jobs j ON j.manifest_id=m.id
                          WHERE m.index_definition_id=%s AND m.chunk_id=%s""",
                          (definition["id"], chunk_id),
                      )
                      assert cur.fetchone() == ("pending", "pending")
                  remaining = index.point_ids(filters={})
                  assert str(orphan_id) not in {
                      str(item["id"]) for item in remaining.get("points", [])
                  }


          '''
          if marker not in text:
              raise RuntimeError(f"{path}: integration test insertion marker missing")
          file.write_text(text.replace(marker, test + marker, 1), encoding="utf-8")

          path = "docs/reduced-real-smoke.md"
          file = Path(path)
          text = file.read_text(encoding="utf-8")
          marker = '''## Mandatory run checks
          '''
          addition = '''## Preflight repair and safety behavior

          Local schema-constrained calls disable model thinking by default so the
          output budget is reserved for the required JSON artifact. The effective
          thinking setting is recorded in attempt and provenance metadata.

          `scripts/research-db index-reconcile --repair` treats physical Qdrant
          coverage as authoritative for the currently configured embedding
          fingerprint. It requeues manifests whose points are missing even when
          PostgreSQL says they are complete, and deletes current-derivation orphan
          points only during the explicit repair operation. Index activation still
          requires exact point-ID equality.

          Preflight service messages redact URL passwords before writing terminal
          output or logs.

          '''
          if marker not in text:
              raise RuntimeError(f"{path}: documentation marker missing")
          file.write_text(text.replace(marker, addition + marker, 1), encoding="utf-8")
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-store.txt pytest ruff

      - name: Format and validate targeted changes
        run: |
          ruff format \
            scripts/model_gateway.py \
            scripts/research_store/preflight.py \
            scripts/research_store/cli.py \
            scripts/test_preflight.py \
            scripts/test_release_invariant_contracts.py \
            scripts/test_research_store_integration.py
          ruff check \
            scripts/model_gateway.py \
            scripts/research_store/preflight.py \
            scripts/research_store/cli.py \
            scripts/test_preflight.py \
            scripts/test_release_invariant_contracts.py \
            scripts/test_research_store_integration.py
          python -m pytest -q -p no:cacheprovider \
            scripts/test_release_invariant_contracts.py \
            scripts/test_preflight.py
          python -m compileall -q scripts
          git diff --check

      - name: Commit and push fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue170-followup-fix.yml
          git add \
            scripts/model_gateway.py \
            scripts/research_store/preflight.py \
            scripts/research_store/cli.py \
            scripts/test_preflight.py \
            scripts/test_release_invariant_contracts.py \
            scripts/test_research_store_integration.py \
            docs/reduced-real-smoke.md
          git commit -m "Fix structured output and index reconciliation"
          git push origin HEAD:agent/issue-170-authoritative-extraction-evidence
