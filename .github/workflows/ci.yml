name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: Exact candidate SHA; defaults to the dispatch SHA
        required: false
        type: string
      base-sha:
        description: Exact comparison base; defaults to candidate for a full dispatch
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate-sha || github.sha }}
  BASE_SHA: ${{ inputs.base-sha || github.event.pull_request.base.sha || github.event.before || inputs.candidate-sha || github.sha }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      selected_count: ${{ steps.outputs.outputs.selected_count }}
      matrix_profiles: ${{ steps.outputs.outputs.matrix_profiles }}
      baseline_sha: ${{ steps.outputs.outputs.baseline_sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact base/head identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if [[ "$GITHUB_EVENT_NAME" = workflow_dispatch && -z "${{ inputs.base-sha }}" ]]; then
            echo "BASE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          git diff --check "$BASE_SHA...$CANDIDATE_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate deterministic impact and membership plan
        shell: bash
        run: |
          set -euo pipefail
          EVENT_KIND=pull_request
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            EVENT_KIND=main
          fi
          python scripts/ci_plan.py \
            --base-sha "$BASE_SHA" \
            --head-sha "$CANDIDATE_SHA" \
            --event "$EVENT_KIND" \
            --output ci-plan.json

      - name: Publish plan outputs
        id: outputs
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path("ci-plan.json").read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"selected_count={plan['selected_non_core_count']}\n")
              handle.write(
                  "matrix_profiles="
                  + json.dumps(plan["matrix_profiles"], separators=(",", ":"))
                  + "\n"
              )
              handle.write(f"baseline_sha={plan['baseline_sha']}\n")
          PY

      - name: Upload exact-head plan and pre-refactor baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-plan-${{ env.CANDIDATE_SHA }}
          path: ci-plan.json
          if-no-files-found: error
          retention-days: 90

  pyrefly:
    name: Pyrefly
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install canonical CI toolchain
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Install canonical package
        run: python -m pip install --no-deps -e .

      - name: Run static profile once
        run: |
          python scripts/run_ci_profile.py \
            --profile static \
            --base-sha "$BASE_SHA" \
            --head-sha "$CANDIDATE_SHA" \
            --namespace "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-static"

  core:
    name: Core
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install canonical CI toolchain
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Install canonical package
        run: python -m pip install --no-deps -e .

      - name: Run core profile
        run: |
          python scripts/run_ci_profile.py \
            --profile core \
            --head-sha "$CANDIDATE_SHA" \
            --namespace "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-core"

  profiles:
    name: Profile — ${{ matrix.profile }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.plan.outputs.matrix_profiles) }}
    steps:
      - name: Record unselected profile state
        if: matrix.profile == '__none__'
        run: echo "No non-core profile selected by the deterministic impact plan."

      - name: Check out exact candidate
        if: matrix.profile != '__none__'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Set up Python 3.12
        if: matrix.profile != '__none__'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install canonical CI toolchain
        if: matrix.profile != '__none__'
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Install canonical package
        if: matrix.profile != '__none__'
        run: python -m pip install --no-deps -e .

      - name: Run selected profile
        if: matrix.profile != '__none__'
        run: |
          python scripts/run_ci_profile.py \
            --profile "${{ matrix.profile }}" \
            --head-sha "$CANDIDATE_SHA" \
            --namespace "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.profile }}"

  merge-gate:
    name: Merge gate
    if: always()
    needs:
      - plan
      - pyrefly
      - core
      - profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Evaluate aggregate authority fail-closed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          STATIC_RESULT: ${{ needs.pyrefly.result }}
          CORE_RESULT: ${{ needs.core.result }}
          PROFILES_RESULT: ${{ needs.profiles.result }}
          SELECTED_COUNT: ${{ needs.plan.outputs.selected_count || '0' }}
        run: |
          python scripts/ci_merge_gate.py \
            --plan "$PLAN_RESULT" \
            --static "$STATIC_RESULT" \
            --core "$CORE_RESULT" \
            --profiles "$PROFILES_RESULT" \
            --selected-count "$SELECTED_COUNT"
