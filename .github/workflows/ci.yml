name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: "Exact commit SHA to validate (workflow_dispatch only)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  format-remediation:
    name: Apply exact Ruff formatting
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'refactor/rc5-database-native-inspection'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply formatter and push
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff==0.16.1
          ruff format \
            scripts/research_store/inspection_contract.py \
            scripts/research_store/inspection_corpus.py \
            scripts/research_store/inspection_history.py \
            scripts/test_database_native_inspection.py \
            scripts/test_database_native_inspection_integration.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/research_store/inspection_contract.py \
            scripts/research_store/inspection_corpus.py \
            scripts/research_store/inspection_history.py \
            scripts/test_database_native_inspection.py \
            scripts/test_database_native_inspection_integration.py
          git commit -m "style(inspection): apply Ruff formatting"
          git push origin "HEAD:${{ github.head_ref }}"

  release-invariants:
    name: "Release invariants — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest

      - name: Run production-boundary release invariant tests
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_release_invariant_contracts.py \
            scripts/test_smoke_test.py \
            scripts/test_release_campaign_verifier.py \
            scripts/test_exact_head_ci_evidence.py

  test:
    name: "Test — Python ${{ matrix.python-version }}"
    needs: release-invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest

      - name: Start disposable PostgreSQL
        run: |
          docker run --name pg -d -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16-alpine
          sleep 5
          for i in $(seq 1 10); do
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE firecrawl_telemetry_test;" 2>/dev/null && break || sleep 1
          done

      - name: Start disposable Qdrant
        # Qdrant client-server pair: qdrant-client==1.15.1 (requirements-research-store.txt)
        # with server v1.18.3. The client is backward-compatible with newer servers.
        # READ_ONLY_ACCESS=false disables the read-only mode guard so test writes
        # (index builds, alias switches) succeed without a separate auth token.
        run: |
          docker run --name qdrant -d -p 6333:6333 \
            -e QDRANT__SERVICE__READ_ONLY_ACCESS=false \
            qdrant/qdrant:v1.18.3-unprivileged
          sleep 3

      - name: Run tests
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1/firecrawl_telemetry_test"
          RESEARCH_STORE_TEST_ALLOW_RESET: "firecrawl_telemetry_test"
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_research_domain.py \
            scripts/test_research_store.py \
            scripts/test_acquisition_service.py \
            scripts/test_orchestrator.py \
            scripts/test_classifier.py \
            scripts/test_workflow.py \
            scripts/test_workflow_service.py \
            scripts/test_budget_policy.py \
            scripts/test_index_runtime.py \
            scripts/test_evidence_packet.py \
            scripts/test_claims_evidence.py \
            scripts/test_retrieval_benchmark.py \
            scripts/test_evidence_grouping.py \
            scripts/test_packet_validator.py \
            scripts/test_duplicate_service.py \
            scripts/test_claim_binding_service.py \
            scripts/test_shadow_comparison.py \
            scripts/test_uow_duplicate_methods.py \
            scripts/test_workflow_benchmark.py \
            scripts/test_handoff.py \
            scripts/test_report_service.py \
            scripts/test_report_validator.py \
            scripts/test_semantic_cache.py \
            scripts/test_resource_governor.py \
            scripts/test_documentation.py \
            scripts/test_terminal_decision.py \
            scripts/test_terminal_decision_authority.py \
            scripts/test_persist_results.py \
            scripts/test_release_benchmark.py \
            scripts/test_release_invariant_contracts.py \
            scripts/test_release_campaign_verifier.py \
            scripts/test_exact_head_ci_evidence.py \
            scripts/test_smoke_test.py \
            scripts/test_performance_telemetry.py \
            scripts/test_performance_telemetry_integration.py \
            scripts/test_strict_campaign.py \
            scripts/test_release_evidence.py \
            scripts/test_database_native_inspection.py \
            scripts/test_database_native_inspection_integration.py \
            scripts/test_research_store_integration.py

  strict-campaign-contract:
    name: "Strict campaign contract tests — Python ${{ matrix.python-version }}"
    needs: release-invariants
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest

      - name: Start disposable PostgreSQL
        run: |
          docker run --name pg -d -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16-alpine
          sleep 5
          for i in $(seq 1 10); do
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE firecrawl_test;" 2>/dev/null && break || sleep 1
          done

      - name: Run strict campaign unit tests
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_strict_campaign.py \
            scripts/test_preflight.py

      - name: Run strict campaign integration tests
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1/firecrawl_test"
          RESEARCH_STORE_TEST_ALLOW_RESET: "firecrawl_test"
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_strict_campaign.py::TestStrictCampaignIntegration

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          ruff --version

      - name: Run Ruff lint checks
        run: ruff check --output-format=github .

      - name: Check Ruff formatting
        run: ruff format --check --diff .

  release-evidence:
    name: "Release evidence (issue #145)"
    needs:
      - release-invariants
      - test
      - strict-campaign-contract
      - lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate-sha || github.sha }}
          fetch-depth: 0

      - name: Verify current main ref is available
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt

      - name: Generate exact-head release-evidence manifest
        id: generate
        continue-on-error: true
        env:
          PYTHONPATH: scripts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_exact_head_ci_evidence.py \
            --repo . \
            --output release-evidence-manifest.json \
            --candidate-sha "${{ inputs.candidate-sha || github.sha }}" \
            --event-sha "$GITHUB_SHA" \
            --event-ref "$GITHUB_REF" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --release-invariants-result "${{ needs.release-invariants.result }}" \
            --test-result "${{ needs.test.result }}" \
            --strict-campaign-contract-result "${{ needs.strict-campaign-contract.result }}" \
            --lint-result "${{ needs.lint.result }}"

      - name: Upload exact-head manifest artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-manifest-${{ inputs.candidate-sha || github.sha }}
          path: release-evidence-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Record release-evidence identity
        if: always()
        shell: bash
        run: |
          {
            echo "candidate_sha=${{ inputs.candidate-sha || github.sha }}"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "artifact_id=${{ steps.upload.outputs.artifact-id }}"
            echo "artifact_url=${{ steps.upload.outputs.artifact-url }}"
            echo "artifact_digest=${{ steps.upload.outputs.artifact-digest }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Enforce exact-head evidence gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.generate.outcome }}" = "success"
          test "${{ steps.upload.outcome }}" = "success"

  dispatch-release-campaign:
    name: Dispatch exact-head release campaign
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[release-candidate]')
    needs:
      - release-invariants
      - test
      - strict-campaign-contract
      - lint
      - release-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read

    steps:
      - name: Verify candidate remains current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          test "$MAIN_SHA" = "$GITHUB_SHA"

      - name: Dispatch exact candidate workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-campaign.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f candidate-sha="$GITHUB_SHA"
