name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: "Exact commit SHA to validate (workflow_dispatch only)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-invariants:
    name: "Release invariants — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest

      - name: Run production-boundary release invariant tests
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            tests/contract/test_release_invariant_contracts.py \
            tests/contract/test_release_package_boundary.py \
            tests/unit/test_smoke_test.py \
            tests/unit/test_release_campaign_verifier.py \
            tests/contract/test_exact_head_ci_evidence.py \
            tests/contract/test_pytest_skip_verifier.py \
            tests/contract/test_pyrefly_gate.py \
            tests/contract/test_package_boundary.py

  test:
    name: "Test — Python ${{ matrix.python-version }}"
    needs: release-invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest

      - name: Start disposable PostgreSQL
        run: |
          docker run --name pg -d -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16-alpine
          sleep 5
          for i in $(seq 1 10); do
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE firecrawl_telemetry_test;" 2>/dev/null && break || sleep 1
          done

      - name: Start disposable Qdrant
        # Qdrant client-server pair: qdrant-client==1.15.1 (requirements-research-store.txt)
        # with server v1.18.3. The client is backward-compatible with newer servers.
        # READ_ONLY_ACCESS=false disables the read-only mode guard so test writes
        # (index builds, alias switches) succeed without a separate auth token.
        run: |
          docker run --name qdrant -d -p 6333:6333 \
            -e QDRANT__SERVICE__READ_ONLY_ACCESS=false \
            qdrant/qdrant:v1.18.3-unprivileged
          sleep 3

      - name: Run tests and classify skips
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1/firecrawl_telemetry_test"
          RESEARCH_STORE_TEST_ALLOW_RESET: "firecrawl_telemetry_test"
          QDRANT_URL: "http://127.0.0.1:6333"
          RESEARCH_STORE_TEST_QDRANT_URL: "http://127.0.0.1:6333"
          RESEARCH_STORE_TEST_QDRANT_ALLOW_RESET: "http://127.0.0.1:6333"
          PYTEST_JUNIT: ${{ runner.temp }}/pytest-${{ matrix.python-version }}.xml
          PYTEST_SKIP_REPORT: ${{ runner.temp }}/pytest-skips-${{ matrix.python-version }}.json
        run: |
          python -m pytest \
            -q \
            -ra \
            --junitxml="$PYTEST_JUNIT" \
            -p no:cacheprovider \
            tests/unit/test_research_domain.py \
            tests/unit/test_research_domain_registry_refactor.py \
            tests/unit/test_research_store.py \
            tests/unit/test_corpus_service_refactor.py \
            tests/unit/test_issue_267_composition_root.py \
            tests/integration/test_issue_217_ingestion_batch_semantics.py \
            tests/integration/test_acquisition_service.py \
            tests/unit/test_orchestrator.py \
            tests/unit/test_classifier.py \
            tests/contract/test_workflow.py \
            tests/unit/test_workflow_service.py \
            tests/unit/test_budget_policy.py \
            tests/unit/test_index_runtime.py \
            tests/unit/test_qdrant_authority.py \
            tests/integration/test_arc17_qdrant_protection.py \
            tests/unit/test_index_census.py \
            tests/unit/test_index_drain.py \
            tests/integration/test_evidence_packet.py \
            tests/integration/test_claims_evidence.py \
            tests/unit/test_retrieval_benchmark.py \
            tests/unit/test_evidence_grouping.py \
            tests/unit/test_packet_validator.py \
            tests/unit/test_duplicate_service.py \
            tests/unit/test_claim_binding_service.py \
            tests/unit/test_shadow_comparison.py \
            tests/integration/test_uow_duplicate_methods.py \
            tests/integration/test_postgres_uow_core.py \
            tests/integration/test_postgres_final_repository_extraction.py \
            tests/integration/test_postgres_corpus_repositories.py \
            tests/integration/test_postgres_research_repositories.py \
            tests/integration/test_postgres_acquisition_repositories.py \
            tests/acceptance/test_extraction_e2e.py \
            tests/unit/test_workflow_benchmark.py \
            tests/unit/test_handoff.py \
            tests/unit/test_report_service.py \
            tests/unit/test_report_validator.py \
            tests/unit/test_semantic_cache.py \
            tests/unit/test_resource_governor.py \
            tests/contract/test_documentation.py \
            tests/unit/test_terminal_decision.py \
            tests/unit/test_terminal_decision_authority.py \
            tests/integration/test_release_benchmark.py \
            tests/contract/test_release_invariant_contracts.py \
            tests/contract/test_release_package_boundary.py \
            tests/unit/test_release_campaign_verifier.py \
            tests/contract/test_exact_head_ci_evidence.py \
            tests/unit/test_smoke_test.py \
            tests/unit/test_performance_telemetry.py \
            tests/integration/test_performance_telemetry_integration.py \
            tests/integration/test_strict_campaign.py \
            tests/acceptance/test_release_evidence.py \
            tests/unit/test_database_native_inspection.py \
            tests/integration/test_database_native_inspection_integration.py \
            tests/integration/test_issue_214_search_relational_provenance.py \
            tests/integration/test_completion_provenance_integration.py \
            tests/integration/test_completion_provenance_terminal_guard.py \
            tests/integration/test_arc17_corrective_defects.py \
            tests/unit/test_release_campaign_followup.py \
            tests/integration/test_research_store_integration.py
          python scripts/verify_pytest_skips.py \
            --junitxml "$PYTEST_JUNIT" \
            --allowlist references/pytest-skip-allowlist.json \
            --output "$PYTEST_SKIP_REPORT"

      - name: Upload broad-suite test and skip evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broad-test-evidence-${{ github.event.pull_request.head.sha || github.sha }}-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/pytest-${{ matrix.python-version }}.xml
            ${{ runner.temp }}/pytest-skips-${{ matrix.python-version }}.json
          if-no-files-found: warn
          retention-days: 90

  strict-campaign-contract:
    name: "Strict campaign contract tests — Python ${{ matrix.python-version }}"
    needs: release-invariants
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest

      - name: Start disposable PostgreSQL
        run: |
          docker run --name pg -d -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16-alpine
          sleep 5
          for i in $(seq 1 10); do
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE firecrawl_test;" 2>/dev/null && break || sleep 1
          done

      - name: Run strict campaign unit tests
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            tests/integration/test_strict_campaign.py \
            tests/unit/test_preflight.py

      - name: Run strict campaign integration tests
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1/firecrawl_test"
          RESEARCH_STORE_TEST_ALLOW_RESET: "firecrawl_test"
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            tests/integration/test_strict_campaign.py::TestStrictCampaignIntegration

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          ruff --version

      - name: Run Ruff lint checks
        run: ruff check --output-format=github .

      - name: Check Ruff formatting
        run: ruff format --check --diff .

  typecheck:
    name: Pyrefly
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact Pyrefly candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate-sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify checked-out Pyrefly candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.candidate-sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-research-store.txt
            requirements-typecheck.txt

      - name: Install project and type-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            -r requirements-typecheck.txt \
            pytest
          pyrefly --version

      - name: Run Pyrefly
        run: pyrefly check --output-format=github

      - name: Run Pyrefly on actual changed Python scope
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed_python < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- '*.py' \
              | grep -vE '(^|/)test_[^/]*\.py$' || true
          )
          if ((${#changed_python[@]} == 0)); then
            echo "No changed non-test Python paths."
            exit 0
          fi
          printf 'Pyrefly changed path: %s\n' "${changed_python[@]}"
          pyrefly check "${changed_python[@]}" --output-format=github

      - name: Verify repository-root import resolution
        run: |
          pyrefly check \
            scripts/model_gateway.py \
            scripts/fixtures/model_gateway.py \
            --output-format=github

      - name: Verify Pyrefly explicit-file diagnostic behavior
        shell: bash
        run: |
          set -euo pipefail
          PROBE="scripts/test_pyrefly_changed_scope_probe.py"
          OUTPUT="$RUNNER_TEMP/pyrefly-changed-scope-probe.txt"
          trap 'rm -f "$PROBE"' EXIT
          cat > "$PROBE" <<'PY'
          def _pyrefly_changed_scope_probe() -> int:
              return "not-an-int"
          PY

          set +e
          pyrefly check "$PROBE" --output-format=github >"$OUTPUT" 2>&1
          rc=$?
          set -e
          cat "$OUTPUT"
          if [ "$rc" -ne 1 ]; then
            echo "Expected Pyrefly diagnostic exit code 1 for the changed-scope probe; got rc=$rc." >&2
            exit 1
          fi
          if ! grep -Fq "$PROBE" "$OUTPUT"; then
            echo "Pyrefly returned diagnostic exit code 1 without identifying the probe file." >&2
            exit 1
          fi

  release-evidence:
    name: "Release evidence (issue #145)"
    needs:
      - release-invariants
      - test
      - strict-campaign-contract
      - lint
      - typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate-sha || github.sha }}
          fetch-depth: 0

      - name: Verify current main ref is available
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt

      - name: Generate exact-head release-evidence manifest
        id: generate
        continue-on-error: true
        env:
          PYTHONPATH: scripts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_exact_head_ci_evidence.py \
            --repo . \
            --output release-evidence-manifest.json \
            --candidate-sha "${{ inputs.candidate-sha || github.sha }}" \
            --event-sha "$GITHUB_SHA" \
            --event-ref "$GITHUB_REF" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --release-invariants-result "${{ needs.release-invariants.result }}" \
            --test-result "${{ needs.test.result }}" \
            --strict-campaign-contract-result "${{ needs.strict-campaign-contract.result }}" \
            --lint-result "${{ needs.lint.result }}" \
            --typecheck-result "${{ needs.typecheck.result }}"

      - name: Upload exact-head manifest artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-manifest-${{ inputs.candidate-sha || github.sha }}
          path: release-evidence-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Record release-evidence identity
        if: always()
        shell: bash
        run: |
          {
            echo "candidate_sha=${{ inputs.candidate-sha || github.sha }}"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "artifact_id=${{ steps.upload.outputs.artifact-id }}"
            echo "artifact_url=${{ steps.upload.outputs.artifact-url }}"
            echo "artifact_digest=${{ steps.upload.outputs.artifact-digest }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Enforce exact-head evidence gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.generate.outcome }}" = "success"
          test "${{ steps.upload.outcome }}" = "success"

  dispatch-release-campaign:
    name: Dispatch exact-head release campaign
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[release-candidate]')
    needs:
      - release-invariants
      - test
      - strict-campaign-contract
      - lint
      - typecheck
      - release-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read

    steps:
      - name: Verify candidate remains current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          test "$MAIN_SHA" = "$GITHUB_SHA"

      - name: Dispatch exact candidate workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-campaign.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f candidate-sha="$GITHUB_SHA"
