name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: "Exact commit SHA to validate (workflow_dispatch only)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  apply-benchmark-v2-cleanup:
    name: Apply validated benchmark v2 cleanup
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/issue-170-authoritative-extraction-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out target branch
        uses: actions/checkout@v7
        with:
          ref: agent/issue-170-authoritative-extraction-evidence
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest \
            ruff

      - name: Apply benchmark v2 cleanup
        run: |
          python scripts/apply_benchmark_v2_cleanup.py
          PYTHONPATH=scripts python -m research_domain.registry --write schemas/research-workflow

      - name: Format and validate cleanup
        run: |
          ruff format \
            scripts/research_domain/models.py \
            scripts/research_store/release_benchmark.py \
            scripts/research_store/strict_benchmark.py \
            scripts/research_store/workflow_benchmark.py \
            scripts/smoke_test.py \
            scripts/test_research_domain.py \
            scripts/test_workflow_benchmark.py \
            scripts/test_release_benchmark.py \
            scripts/test_release_invariant_contracts.py \
            scripts/test_strict_campaign.py \
            scripts/test_smoke_test.py
          ruff check \
            scripts/research_domain/models.py \
            scripts/research_store/release_benchmark.py \
            scripts/research_store/strict_benchmark.py \
            scripts/research_store/workflow_benchmark.py \
            scripts/smoke_test.py \
            scripts/test_research_domain.py \
            scripts/test_workflow_benchmark.py \
            scripts/test_release_benchmark.py \
            scripts/test_release_invariant_contracts.py \
            scripts/test_strict_campaign.py \
            scripts/test_smoke_test.py
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_research_domain.py \
            scripts/test_workflow_benchmark.py \
            scripts/test_release_invariant_contracts.py \
            scripts/test_release_benchmark.py \
            scripts/test_strict_campaign.py \
            scripts/test_smoke_test.py

      - name: Commit validated cleanup
        run: |
          git checkout ce177963a35d68c31bc9428dc27cb93ad86a4489 -- .github/workflows/ci.yml
          git rm .github/workflows/apply-benchmark-v2-cleanup.yml
          git rm scripts/apply_benchmark_v2_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make benchmark v2 the sole release contract"
          git push origin HEAD:agent/issue-170-authoritative-extraction-evidence

  release-invariants:
    name: "Release invariants — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest

      - name: Run production-boundary release invariant tests
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_release_invariant_contracts.py \
            scripts/test_smoke_test.py

  test:
    name: Test — Python ${{ matrix.python-version }}
    needs: release-invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest

      - name: Start disposable PostgreSQL
        run: |
          docker run --name pg -d -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16-alpine
          sleep 5
          for i in $(seq 1 10); do
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE firecrawl_telemetry_test;" 2>/dev/null && break || sleep 1
          done

      - name: Start disposable Qdrant
        # Qdrant client-server pair: qdrant-client==1.15.1 (requirements-research-store.txt)
        # with server v1.18.3.  The client is backward-compatible with newer servers.
        # READ_ONLY_ACCESS=false disables the read-only mode guard so test writes
        # (index builds, alias switches) succeed without a separate auth token.
        run: |
          docker run --name qdrant -d -p 6333:6333 \
            -e QDRANT__SERVICE__READ_ONLY_ACCESS=false \
            qdrant/qdrant:v1.18.3-unprivileged
          sleep 3

      - name: Run tests
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1/firecrawl_telemetry_test"
          RESEARCH_STORE_TEST_ALLOW_RESET: "firecrawl_telemetry_test"
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_research_domain.py \
            scripts/test_research_store.py \
            scripts/test_acquisition_service.py \
            scripts/test_orchestrator.py \
            scripts/test_classifier.py \
            scripts/test_workflow.py \
            scripts/test_budget_policy.py \
            scripts/test_index_runtime.py \
            scripts/test_evidence_packet.py \
            scripts/test_claims_evidence.py \
            scripts/test_retrieval_benchmark.py \
            scripts/test_evidence_grouping.py \
            scripts/test_packet_validator.py \
            scripts/test_duplicate_service.py \
            scripts/test_claim_binding_service.py \
            scripts/test_shadow_comparison.py \
            scripts/test_uow_duplicate_methods.py \
            scripts/test_workflow_benchmark.py \
            scripts/test_handoff.py \
            scripts/test_report_service.py \
            scripts/test_report_validator.py \
            scripts/test_semantic_cache.py \
            scripts/test_resource_governor.py \
            scripts/test_documentation.py \
            scripts/test_terminal_decision.py \
            scripts/test_terminal_decision_authority.py \
            scripts/test_persist_results.py \
            scripts/test_release_benchmark.py \
            scripts/test_release_invariant_contracts.py \
            scripts/test_smoke_test.py \
            scripts/test_performance_telemetry.py \
            scripts/test_performance_telemetry_integration.py \
            scripts/test_strict_campaign.py \
            scripts/test_release_evidence.py \
            scripts/test_research_store_integration.py

  strict-campaign-contract:
    name: "Strict campaign contract tests — Python ${{ matrix.python-version }}"
    needs: release-invariants
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest

      - name: Start disposable PostgreSQL
        run: |
          docker run --name pg -d -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16-alpine
          sleep 5
          for i in $(seq 1 10); do
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE firecrawl_test;" 2>/dev/null && break || sleep 1
          done

      - name: Run strict campaign unit tests
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_strict_campaign.py \
            scripts/test_preflight.py

      - name: Run strict campaign integration tests
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1/firecrawl_test"
          RESEARCH_STORE_TEST_ALLOW_RESET: "firecrawl_test"
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_strict_campaign.py::TestStrictCampaignIntegration

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          ruff --version

      - name: Run Ruff lint checks
        run: ruff check --output-format=github .

      - name: Check Ruff formatting
        run: ruff format --check --diff .

  release-evidence:
    name: "Release evidence (issue #145)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate-sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt

      - name: Generate release-evidence manifest
        id: generate
        env:
          PYTHONPATH: scripts
        run: |
          python -m research_store.release_evidence generate \
            --repo . \
            --output release-evidence-manifest.json
          SHA=$(python -c 'import json,sys; print(json.load(open("release-evidence-manifest.json"))["candidate_sha"])')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-manifest
          path: release-evidence-manifest.json
          retention-days: 90

      - name: Verify manifest against candidate SHA
        env:
          PYTHONPATH: scripts
        run: |
          python -m research_store.release_evidence verify \
            --manifest release-evidence-manifest.json \
            --repo .