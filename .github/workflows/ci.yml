name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-reconciliation-contract:
    name: Validate reconciliation contract fix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/issue-170-authoritative-extraction-evidence
          fetch-depth: 0

      - name: Apply test contract correction
        run: python scripts/issue170_test_contract_fix.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-store.txt pytest ruff

      - name: Start disposable PostgreSQL
        run: |
          docker run --name pg -d -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16-alpine
          sleep 5
          for i in $(seq 1 10); do
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres \
              -c "CREATE DATABASE firecrawl_telemetry_test;" 2>/dev/null && break || sleep 1
          done

      - name: Start disposable Qdrant
        run: |
          docker run --name qdrant -d -p 6333:6333 \
            -e QDRANT__SERVICE__READ_ONLY_ACCESS=false \
            qdrant/qdrant:v1.18.3-unprivileged
          sleep 3

      - name: Validate exact regression
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1/firecrawl_telemetry_test"
          RESEARCH_STORE_TEST_ALLOW_RESET: "firecrawl_telemetry_test"
        run: |
          ruff format scripts/test_research_store_integration.py
          ruff check scripts/test_research_store_integration.py
          python -m pytest -q -p no:cacheprovider \
            scripts/test_research_store_integration.py::TestIndexRebuildRecovery::test_index_build_resume_interrupted_build
          git diff --check

      - name: Commit and push source-only correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test_research_store_integration.py
          git commit -m "Align index rebuild test with physical coverage authority"
          git push origin HEAD:agent/issue-170-authoritative-extraction-evidence
