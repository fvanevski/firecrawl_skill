name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-pr172-integration-fixture:
    name: Apply validated PR 172 integration fixture
    if: github.head_ref == 'agent/issue-170-resolve-pr157-threads'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out follow-up branch
        uses: actions/checkout@v7
        with:
          ref: agent/issue-170-resolve-pr157-threads
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-store.txt pytest ruff

      - name: Patch stale strict-window fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/test_performance_telemetry_integration.py")
          text = path.read_text(encoding="utf-8")
          start_marker = (
              "    def test_resource_complete_with_window_metadata("
              "self, telemetry_connection):\n"
          )
          end_marker = (
              "    def test_resource_incomplete_without_window_metadata("
              "self, telemetry_connection):\n"
          )
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          function = text[start:end]

          old_doc = (
              '"""When resource samples have window metadata, '
              'status should be MEASURED."""'
          )
          new_doc = (
              '"""A complete two-sample CPU window is MEASURED '
              'in strict mode."""'
          )
          if function.count(old_doc) != 1:
              raise SystemExit(
                  f"expected one integration docstring, found {function.count(old_doc)}"
              )
          function = function.replace(old_doc, new_doc, 1)

          samples_start_marker = (
              "        svc = PerformanceTelemetryService(telemetry_connection)\n"
          )
          summary_marker = (
              "        # Build summary to populate run_performance_telemetry.\n"
          )
          samples_start = function.index(samples_start_marker)
          samples_end = function.index(summary_marker, samples_start)
          replacement = '''        svc = PerformanceTelemetryService(telemetry_connection)
          for sample_number, value, sample_at in (
              (0, 40.0, "2026-07-30T11:59:30+00:00"),
              (1, 50.0, "2026-07-30T12:00:00+00:00"),
          ):
              svc.record_resource_sample(
                  ResourceSample(
                      run_id=str(run_id),
                      device_type="cpu",
                      device_index=0,
                      sample_type="cpu_percent",
                      value=value,
                      sample_at=sample_at,
                      collector="psutil",
                      sample_number=sample_number,
                      status="measured",
                      window_start="2026-07-30T11:59:00+00:00",
                      window_end="2026-07-30T12:00:00+00:00",
                      sampling_interval_seconds=1.0,
                  )
              )
          telemetry_connection.commit()

          '''
          function = (
              function[:samples_start]
              + replacement
              + function[samples_end:]
          )
          path.write_text(
              text[:start] + function + text[end:],
              encoding="utf-8",
          )
          PY

      - name: Validate fixture
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1/firecrawl_telemetry_test"
          RESEARCH_STORE_TEST_ALLOW_RESET: "firecrawl_telemetry_test"
        run: |
          ruff format scripts/test_performance_telemetry_integration.py
          ruff check scripts/test_performance_telemetry_integration.py
          docker run --name pg-fix -d -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16-alpine
          sleep 5
          for i in $(seq 1 10); do
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE firecrawl_telemetry_test;" 2>/dev/null && break || sleep 1
          done
          python -m pytest -q -p no:cacheprovider \
            scripts/test_performance_telemetry_integration.py::TestResourceCompleteness

      - name: Commit validated fixture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test_performance_telemetry_integration.py
          git commit -m "test: align resource integration fixture with periodic policy"
          git push origin HEAD:agent/issue-170-resolve-pr157-threads
