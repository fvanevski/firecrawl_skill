name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest

      - name: Run tests
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_research_domain.py \
            scripts/test_research_store.py \
            scripts/test_research_store_integration.py \
            scripts/test_classifier.py \
            scripts/test_workflow.py \
            scripts/test_budget_policy.py \
            scripts/test_index_runtime.py \
            scripts/test_evidence_packet.py \
            scripts/test_claims_evidence.py \
            scripts/test_retrieval_benchmark.py \
            scripts/test_evidence_grouping.py \
            scripts/test_packet_validator.py \
            scripts/test_duplicate_service.py \
            scripts/test_claim_binding_service.py \
            scripts/test_shadow_comparison.py \
            scripts/test_uow_duplicate_methods.py \
            scripts/test_workflow_benchmark.py \
            scripts/test_handoff.py \
            scripts/test_report_service.py \
            scripts/test_report_validator.py \
            scripts/test_semantic_cache.py \
            scripts/test_resource_governor.py \
            scripts/test_documentation.py \
            scripts/test_terminal_decision.py \
            scripts/test_terminal_decision_authority.py \
            scripts/test_persist_results.py \
            scripts/test_release_benchmark.py \
            scripts/test_performance_telemetry.py \
            scripts/test_performance_telemetry_integration.py \
            scripts/test_strict_campaign.py \
            scripts/test_release_evidence.py

  strict-campaign:
    name: Strict Campaign (issue #144) — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt \
            pytest

      - name: Start disposable PostgreSQL
        run: |
          docker run --name pg -d -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:16-alpine
          sleep 5
          for i in $(seq 1 10); do
            PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE firecrawl_test;" 2>/dev/null && break || sleep 1
          done

      - name: Run strict campaign unit tests
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_strict_campaign.py

      - name: Run strict campaign integration tests
        env:
          RESEARCH_STORE_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1/firecrawl_test"
          RESEARCH_STORE_TEST_ALLOW_RESET: "firecrawl_test"
        run: |
          python -m pytest \
            -q \
            -p no:cacheprovider \
            scripts/test_strict_campaign.py::TestStrictCampaignIntegration

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          ruff --version

      - name: Run Ruff lint checks
        run: ruff check --output-format=github .

      - name: Check Ruff formatting
        run: ruff format --check --diff .

  release-evidence:
    name: Release evidence (issue #145)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    inputs:
      candidate-sha:
        description: "Exact commit SHA to validate (workflow_dispatch only)"
        required: false
        type: string

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate-sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research-store.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-research-store.txt

      - name: Generate release-evidence manifest
        id: generate
        run: |
          python -m research_store.release_evidence generate \
            --repo . \
            --output release-evidence-manifest.json
          SHA=$(python -c 'import json,sys; print(json.load(open("release-evidence-manifest.json"))["candidate_sha"])')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-manifest
          path: release-evidence-manifest.json
          retention-days: 90

      - name: Verify manifest against candidate SHA
        run: |
          python -m research_store.release_evidence verify \
            --manifest release-evidence-manifest.json \
            --repo .
