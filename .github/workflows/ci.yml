name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-issue170-fixes:
    name: Apply issue 170 follow-up fixes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/issue-170-authoritative-extraction-evidence
          fetch-depth: 0

      - name: Extract and apply guarded fixer
        run: |
          awk '
            /python - <<'\''PY'\''/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/issue170-followup-fix.yml > /tmp/issue170_fix.py
          test -s /tmp/issue170_fix.py
          python - <<'PY'
          from pathlib import Path

          path = Path("/tmp/issue170_fix.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'if count != 2:\n    raise RuntimeError(f"{path}: expected two provenance seed fields, found {count}")',
              'if count != 1:\n    raise RuntimeError(f"{path}: expected one successful provenance seed field, found {count}")',
          )
          path.write_text(text, encoding="utf-8")
          PY
          python /tmp/issue170_fix.py
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/model_gateway.py")
          text = path.read_text(encoding="utf-8")

          start = text.index("            attempt = {\n")
          latency = text.index('                "latency_ms":', start)
          block = text[start:latency]
          if '"thinking_enabled"' not in block:
              marker = '                "structured_mode": structured_mode,\n'
              marker_at = text.index(marker, start, latency) + len(marker)
              addition = '''                "thinking_enabled": (
                      bool(enable_thinking)
                      if config["api_surface"] == "chat_completions"
                      else None
                  ),
          '''
              text = text[:marker_at] + addition + text[marker_at:]

          old = '''        "seed": 0 if config["api_surface"] == "chat_completions" else None,
                  "prompt_version": prompt_version,
          '''
          new = '''        "seed": 0 if config["api_surface"] == "chat_completions" else None,
                  "thinking_enabled": (
                      bool(enable_thinking)
                      if config["api_surface"] == "chat_completions"
                      else None
                  ),
                  "prompt_version": prompt_version,
          '''
          if text.count(old) != 1:
              raise RuntimeError("failed provenance seed target was not unique")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-store.txt pytest ruff

      - name: Format and validate changes
        run: |
          ruff format \
            scripts/model_gateway.py \
            scripts/research_store/preflight.py \
            scripts/research_store/cli.py \
            scripts/test_preflight.py \
            scripts/test_release_invariant_contracts.py \
            scripts/test_research_store_integration.py
          ruff check \
            scripts/model_gateway.py \
            scripts/research_store/preflight.py \
            scripts/research_store/cli.py \
            scripts/test_preflight.py \
            scripts/test_release_invariant_contracts.py \
            scripts/test_research_store_integration.py
          python -m pytest -q -p no:cacheprovider \
            scripts/test_release_invariant_contracts.py \
            scripts/test_preflight.py
          python -m compileall -q scripts
          git diff --check

      - name: Commit final source changes and remove scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout a8a648055681583da8c39d08c79a7055146b61f3 -- .github/workflows/ci.yml
          git rm .github/workflows/issue170-followup-fix.yml
          git add \
            .github/workflows/ci.yml \
            docs/reduced-real-smoke.md \
            scripts/model_gateway.py \
            scripts/research_store/preflight.py \
            scripts/research_store/cli.py \
            scripts/test_preflight.py \
            scripts/test_release_invariant_contracts.py \
            scripts/test_research_store_integration.py
          git commit -m "Fix structured output and index reconciliation"
          git push origin HEAD:agent/issue-170-authoritative-extraction-evidence
