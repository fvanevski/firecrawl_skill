name: Apply smoke gate hardening

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/issue-170-authoritative-extraction-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-store.txt pytest ruff

      - name: Materialize hardened smoke gate
        env:
          SMOKE_B64: 
          TEST_B64: 
          DOC_B64: 
        run: |
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          payloads = {
              Path('scripts/smoke_test.py'): os.environ['SMOKE_B64'],
              Path('scripts/test_smoke_test.py'): os.environ['TEST_B64'],
              Path('docs/reduced-real-smoke.md'): os.environ['DOC_B64'],
          }
          for path, encoded in payloads.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY

      - name: Format and validate implementation
        run: |
          ruff check --fix scripts/smoke_test.py scripts/test_smoke_test.py
          ruff format scripts/smoke_test.py scripts/test_smoke_test.py
          ruff check scripts/smoke_test.py scripts/test_smoke_test.py
          ruff format --check scripts/smoke_test.py scripts/test_smoke_test.py
          python -m py_compile scripts/smoke_test.py scripts/test_smoke_test.py
          python -m pytest -q -p no:cacheprovider scripts/test_smoke_test.py
          git diff --check

      - name: Commit validated source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/smoke_test.py scripts/test_smoke_test.py docs/reduced-real-smoke.md
          git commit -m 'test: harden reduced real smoke gate'
          git push origin "HEAD:${{ github.head_ref }}"
