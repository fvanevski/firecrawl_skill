name: Export PR source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    if: github.head_ref == 'agent/remove-legacy-catalog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package source tree
        run: |
          set -euo pipefail
          tar --exclude=.git -C "$GITHUB_WORKSPACE" -czf "$RUNNER_TEMP/firecrawl-skill-source.tgz" .
      - uses: actions/upload-artifact@v4
        with:
          name: firecrawl-skill-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/firecrawl-skill-source.tgz
          if-no-files-found: error
          retention-days: 1
