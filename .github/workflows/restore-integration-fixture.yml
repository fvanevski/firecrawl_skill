name: Restore integration fixture

on:
  push:
    branches:
      - rc/audit-04-index-checkpoint-terminal-decision

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore immutable fixture and update migration head
        shell: bash
        run: |
          set -euo pipefail
          target='scripts/test_research_store_integration.py'
          workflow='.github/workflows/restore-integration-fixture.yml'
          parent='3cb4fef01473581a9c649d05559156087796c1ca'
          git show "$parent:$target" > /tmp/original-fixture.py
          test "$(git hash-object /tmp/original-fixture.py)" = '959595733b362494117cf48692a594ecfc64ffcf'
          cp /tmp/original-fixture.py "$target"
          python - <<'PY'
          from pathlib import Path

          target = Path('scripts/test_research_store_integration.py')
          original = Path('/tmp/original-fixture.py').read_bytes()
          old = b'assert cursor.fetchone()[0] == "0038_postgres_authority"'
          new = b'assert cursor.fetchone()[0] == "0039_index_checkpoint_guard"'
          if original.count(old) != 1:
              raise SystemExit(f'expected exactly one migration-head assertion, found {original.count(old)}')
          expected = original.replace(old, new)
          target.write_bytes(expected)
          actual = target.read_bytes()
          if actual != expected:
              raise SystemExit('restored fixture does not match the immutable expected bytes')
          if len(actual) != 156510:
              raise SystemExit(f'unexpected restored fixture size: {len(actual)}')
          PY
          git diff --check -- "$target"
          git rm "$workflow"
          git add "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(tests): restore integration suite and update migration head'
          git push origin "HEAD:${GITHUB_REF_NAME}"
