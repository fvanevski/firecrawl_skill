name: Restore integration fixture

on:
  push:
    branches:
      - rc/audit-04-index-checkpoint-terminal-decision

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore immutable fixture and patch one obsolete test
        shell: bash
        run: |
          set -euo pipefail
          target='scripts/test_research_store_integration.py'
          workflow='.github/workflows/restore-integration-fixture.yml'
          transformer='scripts/restore_integration_fixture.py'
          parent='3cb4fef01473581a9c649d05559156087796c1ca'
          git show "$parent:$target" > /tmp/original-fixture.py
          test "$(git hash-object /tmp/original-fixture.py)" = '959595733b362494117cf48692a594ecfc64ffcf'
          python "$transformer" /tmp/original-fixture.py "$target"
          python -m py_compile "$target"
          git diff --check -- "$target"
          git rm "$workflow" "$transformer"
          git add "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(tests): restore integration suite and patch terminal fixture'
          git push origin "HEAD:${GITHUB_REF_NAME}"
