name: Restore integration fixture

on:
  push:
    branches:
      - rc/audit-04-index-checkpoint-terminal-decision

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore immutable fixture and update migration head
        shell: bash
        run: |
          set -euo pipefail
          target='scripts/test_research_store_integration.py'
          workflow='.github/workflows/restore-integration-fixture.yml'
          git show 3cb4fef01473581a9c649d05559156087796c1ca:"$target" > "$target"
          test "$(wc -c < "$target")" -eq 156506
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/test_research_store_integration.py')
          text = path.read_text(encoding='utf-8')
          old = 'assert cursor.fetchone()[0] == "0038_postgres_authority"'
          new = 'assert cursor.fetchone()[0] == "0039_index_checkpoint_guard"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one migration-head assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          test "$(wc -c < "$target")" -eq 156510
          git diff --check -- "$target"
          test "$(git diff --numstat -- "$target")" = $'1\t1\tscripts/test_research_store_integration.py'
          git rm "$workflow"
          git add "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(tests): restore integration suite and update migration head'
          git push origin "HEAD:${GITHUB_REF_NAME}"
