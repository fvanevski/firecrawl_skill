name: Finalize smoke gate hardening v2

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/issue-170-authoritative-extraction-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research-store.txt pytest ruff

      - name: Apply structural fail-closed refinements
        run: |
          python - <<'PY'
          from pathlib import Path

          smoke_path = Path('scripts/smoke_test.py')
          lines = smoke_path.read_text(encoding='utf-8').splitlines()

          canonical_index = next(
              index
              for index, line in enumerate(lines)
              if line.strip() == 'canonical_source = _canonical_endpoint(source_endpoint)'
          )
          indent = lines[canonical_index][: len(lines[canonical_index]) - len(lines[canonical_index].lstrip())]
          lines[canonical_index:canonical_index] = [
              f'{indent}if not autonomous_endpoints:',
              f'{indent}    raise SmokeGateError(',
              f'{indent}        "an explicit autonomous local model endpoint fingerprint is required"',
              f'{indent}    )',
          ]

          inspect_index = next(
              index
              for index, line in enumerate(lines)
              if line.strip() == 'def inspect(self, run: Any) -> dict[str, Any]:'
          )
          method_indent = lines[inspect_index][: len(lines[inspect_index]) - len(lines[inspect_index].lstrip())]
          body = method_indent + '    '
          helper = [
              f'{method_indent}@staticmethod',
              f'{method_indent}def _draft_report_text(',
              f'{body}synthesis_rows: Sequence[tuple[Any, Any, Any]],',
              f'{method_indent}) -> str:',
              f'{body}"""Return only persisted completed draft report-section bodies."""',
              f'{body}for stage, status, artifact in reversed(synthesis_rows):',
              f'{body}    if stage != "draft" or status != "completed":',
              f'{body}        continue',
              f'{body}    if not isinstance(artifact, Mapping):',
              f'{body}        return ""',
              f'{body}    sections = artifact.get("report_sections")',
              f'{body}    if not isinstance(sections, list):',
              f'{body}        return ""',
              f'{body}    bodies = [',
              f'{body}        str(section.get("body") or "").strip()',
              f'{body}        for section in sections',
              f'{body}        if isinstance(section, Mapping)',
              f'{body}    ]',
              f'{body}    return "\\n\\n".join(body for body in bodies if body)',
              f'{body}return ""',
              '',
          ]
          lines[inspect_index:inspect_index] = helper

          stage_start = next(
              index
              for index, line in enumerate(lines)
              if line.strip() == 'for required_stage in ("citation_pass", "validation"):'
          )
          agent_start = next(
              index
              for index in range(stage_start + 1, len(lines))
              if lines[index].strip() == 'if run.mode == "agent_led":'
          )
          block_indent = lines[stage_start][
              : len(lines[stage_start]) - len(lines[stage_start].lstrip())
          ]
          nested = block_indent + '    '
          replacement = [
              f'{block_indent}for required_stage in (',
              f'{nested}"outline",',
              f'{nested}"binding",',
              f'{nested}"draft",',
              f'{nested}"citation_pass",',
              f'{nested}"validation",',
              f'{block_indent}):',
              f'{nested}if required_stage not in completed_stages:',
              f'{nested}    errors.append(',
              f'{nested}        f"missing completed synthesis stage: {{required_stage}}"',
              f'{nested}    )',
              f'{block_indent}report_text = self._draft_report_text(synthesis_rows)',
              f'{block_indent}if len(report_text) < 200:',
              f'{nested}errors.append(',
              f'{nested}    "no substantive completed draft report body "',
              f'{nested}    "(minimum 200 characters)"',
              f'{nested})',
              '',
          ]
          lines[stage_start:agent_start] = replacement
          smoke_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          tests_path = Path('scripts/test_smoke_test.py')
          tests = tests_path.read_text(encoding='utf-8')
          marker = 'def test_external_supplier_requires_autonomous_endpoint_fingerprint():'
          if marker not in tests:
              tests += '''

          def test_external_supplier_requires_autonomous_endpoint_fingerprint():
              with pytest.raises(smoke_test.SmokeGateError, match="endpoint fingerprint"):
                  smoke_test.ExternalProcessHostArtifactSupplier(
                      ["external-agent"],
                      supplier_identity="review-agent",
                      source_endpoint="http://review-agent:9000",
                      autonomous_endpoints=[],
                  )


          def test_draft_report_text_uses_only_completed_draft_sections():
              rows = [
                  ("outline", "completed", {"long_prompt": "x" * 500}),
                  ("draft", "failed", {"report_sections": [{"body": "y" * 500}]}),
                  (
                      "draft",
                      "completed",
                      {"report_sections": [{"body": "first"}, {"body": "second"}]},
                  ),
                  ("citation_pass", "completed", {"analysis": "z" * 500}),
              ]

              assert smoke_test.RunEvidenceInspector._draft_report_text(rows) == (
                  "first\\n\\nsecond"
              )
          '''
          tests_path.write_text(tests, encoding='utf-8')
          PY

      - name: Format and validate
        run: |
          ruff check --fix scripts/smoke_test.py scripts/test_smoke_test.py
          ruff format scripts/smoke_test.py scripts/test_smoke_test.py
          ruff check scripts/smoke_test.py scripts/test_smoke_test.py
          ruff format --check scripts/smoke_test.py scripts/test_smoke_test.py
          python -m py_compile scripts/smoke_test.py scripts/test_smoke_test.py
          python -m pytest -q -p no:cacheprovider scripts/test_smoke_test.py
          git diff --check

      - name: Commit validated refinements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/smoke_test.py scripts/test_smoke_test.py
          git commit -m 'test: fail closed on smoke authority and report evidence'
          git push origin "HEAD:${{ github.head_ref }}"
